# Checks for Corner & Kettle. Two Node suites, the balance band, and the real
# page in headless Chromium, all exiting non-zero on a failure (locked #13).
# gvb-save.test.mjs used to run here too; site-ci.yml now runs it on every pull
# request, not only the ones that touch this folder.
#
# smoke-sim.mjs is the one that matters most: it is the file that proves the
# shop runs the same way twice on a seed and that a whole shift in one call is
# the same shift as 8,160 frames. A change to the clock or to a Math.random()
# slipped back into the page is exactly what it is for.
#
# balance.mjs plays 100 seeds for 30 days under three autopilots plus a stress
# day, the staff-economy and word-of-mouth sweeps (Phase 5/6, #348/#349), about
# a minute and a half, and fails outside its BAND. The band is the guard-rail
# against "unplayable" and "free"; a tuning change that trips it is meant to be
# read, not widened past.
#
# test/drive-save.mjs boots the real page through Tools/board-check's harness,
# so it runs as its own job after the Node suites, with the harness installed.
# It used to be run by hand; the harness turned out to work on a Linux runner
# once daredevil-ci.yml proved it.
#
# The page is Projects/corner-and-kettle/index.html and js/ui.js since Phase 4,
# both inside the first path below; smoke-sim's section 10 reads them and the
# other view modules for rules they must not own. coffee_shop_sim.html stays in
# the list because it is the redirect stub section 10 also checks.
# gvb-save.js is there because save.js is a thin layer over it.

name: Corner & Kettle CI

on:
  pull_request:
    paths:
      - "Projects/corner-and-kettle/**"
      - "Projects/coffee_shop_sim.html"
      - "assets/js/gvb-save.js"
      - "Tools/board-check/harness.mjs"
      - "Tools/board-check/package-lock.json"
      - ".github/workflows/corner-kettle-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Projects/corner-and-kettle/**"
      - "Projects/coffee_shop_sim.html"
      - "assets/js/gvb-save.js"
      - "Tools/board-check/harness.mjs"
      - "Tools/board-check/package-lock.json"
      - ".github/workflows/corner-kettle-ci.yml"

permissions:
  contents: read

concurrency:
  group: corner-kettle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: smoke-sim, smoke-save, balance
    uses: ./.github/workflows/suite.yml
    with:
      working-directory: Projects/corner-and-kettle
      commands: |
        node test/smoke-sim.mjs
        node test/smoke-save.mjs
        node test/balance.mjs

  browser:
    name: drive-save in headless Chromium
    needs: node
    uses: ./.github/workflows/suite.yml
    with:
      install: Tools/board-check
      commands: |
        node Projects/corner-and-kettle/test/drive-save.mjs
