# The page suite for The Fracture Cycle (#963). test/smoke.mjs walks the story
# in bare Node and has run in site-ci.yml on every pull request since the game
# got a suite; nothing opened the page. test/browser.mjs does: headless
# Chromium, real clicks down 23 of the walker's 519 paths (a cover of every
# choice, every list of choices a screen offers and every ending from every
# prong), with the title, prose, choices and status bar on screen compared at
# each step with what test/story.mjs's walker says, the one smoke.mjs uses.
# Then two paths by keyboard alone, the save across reloads, a save from before
# the fourth prong, Export and Import through the save bar, reduced motion, and
# overflow at 360 and 1920 px. 76 checks, about a minute and a half. On its
# first run it found two faults smoke.mjs could not see: focus fell to the body
# after every choice, and the scroll to the top stayed smooth under
# prefers-reduced-motion.
#
# It borrows Tools/board-check's harness, the way Absalom's browser.mjs does
# (#880), and suite.yml's `install` gives the job that folder's `npm ci`; it
# runs from the repo root. smoke.mjs is not repeated here: site-ci.yml runs it.
#
# The page is in the path list because it is the game. gvb-save.js is there
# because the save bar and the slot are its code. The three Tools/board-check
# files are what the job borrows: the server and the launch, the file chooser's
# helper, and the lockfile that pins the Chromium.

name: Fracture Cycle CI

on:
  pull_request:
    paths:
      - "Projects/the-fracture-cycle/**"
      - "Projects/the-fracture-cycle.html"
      - "assets/js/gvb-save.js"
      - "Tools/board-check/harness.mjs"
      - "Tools/board-check/drive.mjs"
      - "Tools/board-check/package-lock.json"
      - ".github/workflows/fracture-cycle-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Projects/the-fracture-cycle/**"
      - "Projects/the-fracture-cycle.html"
      - "assets/js/gvb-save.js"
      - "Tools/board-check/harness.mjs"
      - "Tools/board-check/drive.mjs"
      - "Tools/board-check/package-lock.json"
      - ".github/workflows/fracture-cycle-ci.yml"

permissions:
  contents: read

concurrency:
  group: fracture-cycle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser.mjs in headless Chromium
    uses: ./.github/workflows/suite.yml
    with:
      install: Tools/board-check
      commands: |
        node Projects/the-fracture-cycle/test/browser.mjs
