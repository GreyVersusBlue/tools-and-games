# Checks for The Absalom Inheritance. Three rounds and a phase shipped, and
# each of their pull requests said the same thing: no workflow in this repo
# path-matches Projects/absalom-inheritance/**, so both suites ran in a
# session's terminal and nowhere else. That is 1,370 assertions and 8,000
# seeded playthroughs — four builds now, not two — about three minutes of Node
# with no browser and no dependency, and both already exit non-zero on a
# failure (locked #13).
#
# There is a third suite and it is deliberately not here: test/browser.mjs
# boots the real page in real Chromium and asserts the hint bar, the log's
# colours, the build's prism, the keyboard's refusals, the picker stacking to
# one column at 375px with four cards, a per-build satchel in the inventory
# panel, the second buff's ring and readout, and ?pack= opening the second
# adventure off the same HTML file under its own storage key. It is 51 checks,
# and two of the things it has caught were invisible to smoke.mjs: a satchel
# resolved on the wrong side of `selectPc`, and a board that sat frozen after a
# save reopened on a creature's turn. It needs
# playwright-core and a browser on disk, neither of which the game itself has
# any use for, and it is run by hand — the same arrangement Blue Hour's
# test/browser.mjs already has. Unlike the suites site-ci.yml runs, it launches its
# own Chromium from a fixed path rather than borrowing Tools/board-check's
# harness, so joining CI means porting it to the harness first.
#
# The shell page is in the path list because it carries the CSS and the element
# ids ui.js reads, and a commit that edits it and not the folder still has to
# run. gvb-save.js is there because save.js is a thin layer over it.
#
# balance.mjs is the one that matters most and the one most likely to be
# skipped by hand: it is the file that found out the original single-file build
# could not be won on any seed, and it fails if either build leaves the 45-90%
# band — all four of them, since each build gets its own batch and its own
# check. A dice-math change that quietly makes the vault unwinnable is exactly
# what it is for, and thirty seconds of CI is a cheap place to find that out.
# It fails on three more things now: a command in a build's list that the
# autopilot never casts across the whole batch, an ability named by a creature
# that no creature ever uses, and a drift from test/baseline.json. Phase 3
# added two commands and neither went off on the first run; the phase before it
# shipped a spell that had never been cast in a single number this project had
# quoted; and a creature ability has one more way to go silent than either,
# because no player policy can reach it and it cannot appear in the cast list at
# all.
#
# The baseline is the one that will fail on a change somebody meant. The band
# is 45 points wide and a 3-point regression walks through it; baseline.json is
# the numbers the last commit measured, per build and per encounter, and the
# batch is seeded so the comparison is exact rather than statistical. A red
# check here names the fight that moved. If it is the change you meant, rerun
# with --write-baseline and commit the file.
#
# The job itself runs through suite.yml, the shared template. Site-wide checks
# (Tools/board-check, gvb-save.test.mjs, the projects with no workflow of their
# own) live in site-ci.yml and run on every pull request.

name: Absalom Inheritance CI

on:
  pull_request:
    paths:
      - "Projects/absalom-inheritance/**"
      - "Projects/absalom_inheritance.html"
      - "assets/js/gvb-save.js"
      - ".github/workflows/absalom-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Projects/absalom-inheritance/**"
      - "Projects/absalom_inheritance.html"
      - "assets/js/gvb-save.js"
      - ".github/workflows/absalom-ci.yml"

permissions:
  contents: read

concurrency:
  group: absalom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # smoke is its own line so a red job names it. balance runs 2000 per build,
  # 8,000 playthroughs across the four, which is what the project's own README
  # tells a contributor to run. Fewer would widen the band's error bars for no
  # saving worth having.
  suite:
    name: smoke.mjs and balance.mjs
    uses: ./.github/workflows/suite.yml
    with:
      working-directory: Projects/absalom-inheritance
      commands: |
        node test/smoke.mjs
        node test/balance.mjs 2000
