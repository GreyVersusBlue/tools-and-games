/*
  Schedule Visualizer 2: the staff browser.

  One stylesheet, and the only one a published file carries: the assembler
  puts this file inside the page with each font below turned into data, so it
  may name nothing but ../fonts/*.woff2. It imports nothing.

  The tokens are the planner's (ui/tokens.css), copied here because a published
  file cannot reach that file. test/publish/staff.test.mjs fails when a token
  here and the token of the same name there differ. The band papers, the bar
  and the column are this file's own.

  Phone first: 17 px base, every field at 16 px or more, a bar along the bottom
  that leaves while a field has focus. From 900 px the bar is a rail on the
  left and a page sits in a 720 px column.

  What a view can use (staff/views.js has the contract):

    .page__body            the article pageOf() returns
    .page__title           the one headline of the page (pageOf makes it)
    .lede                  the sentence a page starts with
    .card  .card__title    a panel; a day type's day is one card
    .rows  .row            a day, a row a period:
                           .row__when  .row__what  .row__where   .row--now
    .chip                  a subject or group mark: a dot in --chip and a word
    .list  .list__link     a list of links: .list__name  .list__detail
    .btn  .btn--primary  .btn--wide
    .field  .field__label  .field__input  .field__says
    .tabs  .tab            floor tabs, day-type tabs (aria-selected or aria-current)
    .table                 a plain table
    .figure                a big number, in the plan face
    .split                 page and map side by side from 900 px
    .map                   the frame a floor plan is drawn in
    .band  .band--stale  .band--note
    .muted                 secondary text
    .plan                  text in the plan face (room numbers on a map)

  From SV2-21 (the teacher, group, room, building map and staffing pages):

    .facts                 the header card's lines: a dl of div > dt + dd
    .days  .day            the day cards; side by side where there is room
    .row__period  .row__time  .row__mark   inside .row__when
    .part  .part__title    a titled part of a page
    .actions               a row of buttons
    .scroll                a table that may be wider than a phone
    .table--figures  .table__under
    .legend  .chip--none   the subject colours of a floor
    .plain                 a list that links nowhere
    .mapbox  .map__bar  .map__tabs  .map__zooms  .map__zoom
    .map__plan  .map__pulse  .map__says  .map__which  .map__ask
    .split__side           the map's place in .split

  From SV2-23 (my schedule, notes, what a page hands over, the door sign, paper):

    .print-only            on paper only; .no-print (SV2-22) is its opposite
    .page__printed         the "Printed 1 September" line pageOf() makes
    .page__outputs         Print and Share, under every page (pageOf makes it)
    .outputs  .outputs__row   under a teacher's day: print, image, door sign, "This is me"
    .row__note  .note      a note under a period: .note__paper  .note__input
                           .note__count (how much of the 200 is used, near the end)
    .sheet                 a sheet of paper on screen (the door sign's preview)
    .sign                  the door sign: .sign__card (the lines below, which on
                           a phone are the sheet)  .sign__word  .sign__number
                           .sign__teacher  .sign__subject  .sign__school
                           .sign__day  .sign__kind  .sign__kindname  .sign__table
*/

/* ---------- Tokens: the same in both themes ---------- */

:root {
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-plan: "Barlow Semi Condensed", "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --numeric: tabular-nums;

  --base: 16px;
  --base-phone: 17px;

  --t-xs: 0.75rem;    --lh-xs: 1.2;
  --t-sm: 0.875rem;   --lh-sm: 1.35;
  --t-md: 1rem;       --lh-md: 1.5;
  --t-lg: 1.25rem;    --lh-lg: 1.3;
  --t-xl: 1.75rem;    --lh-xl: 1.15;
  --t-fig: 2.5rem;    --lh-fig: 1;

  --w-regular: 400;
  --w-semibold: 600;
  --w-bold: 700;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  --r-1: 3px;
  --r-2: 6px;

  --border-width: 1px;
  --border: var(--border-width) solid var(--line);
  --focus-width: 2px;
  --focus-offset: 2px;

  --dur-1: 120ms;
  --ease: cubic-bezier(0, 0, 0.2, 1);

  --room-strength: 0.7;

  /* This file's own. */
  --bar-height: 56px;
  --rail-width: 88px;
  --column: 720px;
  --tap: 44px;
}

/* ---------- Light ---------- */

:root,
[data-theme="light"],
[data-theme="auto"] {
  color-scheme: light;

  --paper: #f6f3ec;
  --card: #fffdf8;
  --ink: #1f2328;
  --ink-2: #515761;
  --line: #d8d3c8;
  --line-strong: #857f73;

  --accent: #0f6e66;
  --accent-ink: #ffffff;
  --accent-soft: #d9ece9;
  --focus: var(--accent);

  --problem: #b3261e;
  --warning: #925d00;
  --note: #3b5b8a;

  --grid: #e8e3d8;
  --corridor: #ffffff;
  --corridor-edge: var(--line);
  --stairs: #d9ece9;
  --room-default: #e9e4d9;

  --shadow: 0 6px 24px rgba(31, 35, 40, 0.18);

  --stale-paper: #f8ebbd;           /* the yellow band of an old copy; --ink on it */
  --note-paper: #e3eaf4;            /* the band of a quiet notice; --ink on it */
  --map-corridor: #ffffff;          /* a corridor on the staff map; its --line-strong outline is its 3:1 against --grid here */
}

/* ---------- Dark, chosen ---------- */

[data-theme="dark"] {
  color-scheme: dark;

  --paper: #15181c;
  --card: #1d2126;
  --ink: #e8e6e1;
  --ink-2: #a9adb4;
  --line: #343a42;
  --line-strong: #707a86;

  --accent: #5fc2b8;
  --accent-ink: #0b1a18;
  --accent-soft: #163a37;
  --focus: var(--accent);

  --problem: #ff8a80;
  --warning: #ffc86b;
  --note: #8fb4ea;

  --grid: #1a1e23;
  --corridor: #2a2f36;
  --corridor-edge: var(--line);
  --stairs: #163a37;
  --room-default: #2f343b;

  --shadow: 0 6px 24px rgba(0, 0, 0, 0.55);

  --stale-paper: #3d3210;
  --note-paper: #1c2a3d;
  --map-corridor: #69717d;          /* 3.4:1 against --grid: the planner's --corridor is 1.2:1, and was lost on a phone */
}

/* ---------- Dark, following the device: the same values as the block above ---------- */

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]),
  [data-theme="auto"] {
    color-scheme: dark;

    --paper: #15181c;
    --card: #1d2126;
    --ink: #e8e6e1;
    --ink-2: #a9adb4;
    --line: #343a42;
    --line-strong: #707a86;

    --accent: #5fc2b8;
    --accent-ink: #0b1a18;
    --accent-soft: #163a37;
    --focus: var(--accent);

    --problem: #ff8a80;
    --warning: #ffc86b;
    --note: #8fb4ea;

    --grid: #1a1e23;
    --corridor: #2a2f36;
    --corridor-edge: var(--line);
    --stairs: #163a37;
    --room-default: #2f343b;

    --shadow: 0 6px 24px rgba(0, 0, 0, 0.55);

    --stale-paper: #3d3210;
    --note-paper: #1c2a3d;
    --map-corridor: #69717d;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-1: 0ms;
  }
}

/* ---------- The page ---------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: var(--base-phone);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--t-md);
  line-height: var(--lh-md);
  -webkit-tap-highlight-color: transparent;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
p,
ul,
ol {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

a {
  color: var(--accent);
  text-underline-offset: 0.15em;
}

:focus-visible {
  outline: var(--focus-width) solid var(--focus);
  outline-offset: var(--focus-offset);
  border-radius: var(--r-1);
}

h1:focus {
  outline: none;
}

.icon {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.muted {
  color: var(--ink-2);
}

.plan {
  font-family: var(--font-plan);
  font-weight: var(--w-semibold);
}

.row,
.table,
.figure {
  font-variant-numeric: var(--numeric);   /* where numbers line up, and only there */
}

.figure {
  font-family: var(--font-plan);
  font-weight: var(--w-semibold);
  font-size: var(--t-fig);
  line-height: var(--lh-fig);
}

/* ---------- The frame of an open schedule ---------- */

.app[data-state="open"] {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--bar-height) + env(safe-area-inset-bottom, 0px));
}

.app[data-state="open"][data-typing="true"] {
  padding-bottom: 0;
}

.top {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  padding: max(var(--s-1), env(safe-area-inset-top, 0px)) max(var(--s-4), env(safe-area-inset-right, 0px)) var(--s-1) max(var(--s-4), env(safe-area-inset-left, 0px));
  border-bottom: var(--border);
  background: var(--card);
}

.top__school {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  color: var(--ink);
  font-size: var(--t-sm);
  font-weight: var(--w-semibold);
  letter-spacing: 0.01em;
  text-decoration: none;
}

.bands:empty {
  display: none;
}

.band {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) max(var(--s-4), env(safe-area-inset-right, 0px)) var(--s-3) max(var(--s-4), env(safe-area-inset-left, 0px));
  border-bottom: var(--border);
  border-left: var(--s-1) solid var(--note);
  background: var(--note-paper);
  color: var(--ink);
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.band--stale {
  border-left-color: var(--warning);
  background: var(--stale-paper);
}

.band__text {
  flex: 1;
}

.band__close {
  flex: none;
  min-height: var(--tap);
  padding: 0 var(--s-3);
  border: var(--border-width) solid var(--line-strong);
  border-radius: var(--r-1);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-weight: var(--w-semibold);
  cursor: pointer;
}

.page {
  flex: 1;
  width: 100%;
  max-width: var(--column);
  margin: 0 auto;
  padding: var(--s-5) max(var(--s-4), env(safe-area-inset-right, 0px)) var(--s-6) max(var(--s-4), env(safe-area-inset-left, 0px));
}

.page__body > * + * {
  margin-top: var(--s-4);
}

.page__title {
  font-size: var(--t-xl);
  line-height: var(--lh-xl);
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
}

.lede {
  color: var(--ink-2);
  font-size: var(--t-md);
}

.page__title + .lede {
  margin-top: var(--s-2);
}

.foot {
  width: 100%;
  max-width: var(--column);
  margin: 0 auto;
  padding: var(--s-4) max(var(--s-4), env(safe-area-inset-right, 0px)) var(--s-5) max(var(--s-4), env(safe-area-inset-left, 0px));
  border-top: var(--border);
  color: var(--ink-2);
  font-size: var(--t-xs);
  line-height: var(--lh-sm);
}

/* ---------- The bar ---------- */

.bar {
  position: fixed;
  z-index: 10;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  height: calc(var(--bar-height) + env(safe-area-inset-bottom, 0px));
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  border-top: var(--border);
  background: var(--card);
}

.app[data-typing="true"] .bar {
  display: none;
}

.bar__item {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: var(--tap);
  color: var(--ink-2);
  font-size: var(--t-xs);
  font-weight: var(--w-semibold);
  line-height: var(--lh-xs);
  text-decoration: none;
}

.bar__item:focus-visible {
  outline-offset: calc(0px - var(--focus-width) - 2px);
}

.bar__item[aria-current="page"] {
  color: var(--accent);
}

/* The current item is marked by a rule as well as by colour. */
.bar__item[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 0;
  left: 22%;
  right: 22%;
  height: 3px;
  border-radius: 0 0 var(--r-1) var(--r-1);
  background: var(--accent);
}

/* ---------- Cards, rows, lists ---------- */

.card {
  padding: var(--s-4);
  border: var(--border);
  border-radius: var(--r-2);
  background: var(--card);
}

.card > * + * {
  margin-top: var(--s-3);
}

.card__title {
  font-size: var(--t-lg);
  line-height: var(--lh-lg);
  font-weight: var(--w-semibold);
}

.rows {
  border-top: var(--border);
}

.row {
  display: grid;
  grid-template-columns: minmax(5.5rem, auto) 1fr auto;
  gap: var(--s-1) var(--s-3);
  align-items: baseline;
  min-height: var(--tap);
  padding: var(--s-2) 0;
  border-bottom: var(--border);
}

.row__when {
  color: var(--ink-2);
  font-size: var(--t-sm);
}

.row__what {
  font-weight: var(--w-semibold);
}

.row__where {
  text-align: right;
}

.row--now {
  margin: 0 calc(0px - var(--s-2));
  padding-right: var(--s-2);
  padding-left: calc(var(--s-2) - var(--s-1));
  border-left: var(--s-1) solid var(--accent);
  background: var(--accent-soft);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: 2px var(--s-2);
  border: var(--border);
  border-radius: var(--r-1);
  background: var(--card);
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.chip::before {
  content: "";
  flex: none;
  width: 0.7em;
  height: 0.7em;
  border-radius: 2px;
  background: var(--chip, var(--line-strong));
}

.list {
  border: var(--border);
  border-radius: var(--r-2);
  background: var(--card);
  overflow: hidden;
}

.list > li + li {
  border-top: var(--border);
}

.list__link {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: var(--tap);
  padding: var(--s-2) var(--s-4);
  color: var(--ink);
  text-decoration: none;
}

.list__link:focus-visible {
  outline-offset: calc(0px - var(--focus-width) - 1px);
  background: var(--accent-soft);
}

@media (hover: hover) {
  .list__link:hover {
    background: var(--accent-soft);
  }
}

.list__name {
  font-weight: var(--w-semibold);
}

.list__detail {
  color: var(--ink-2);
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.results > * + *,
.more {
  margin-top: var(--s-5);
}

.results:empty {
  display: none;
}

.results__heading {
  margin-bottom: var(--s-2);
  color: var(--ink-2);
  font-size: var(--t-xs);
  font-weight: var(--w-bold);
  letter-spacing: 0.08em;
  line-height: var(--lh-xs);
  text-transform: uppercase;
}

.results__count {
  color: var(--ink-2);
  font-size: var(--t-sm);
}

.results__count:empty {
  display: none;
}

/* ---------- Fields and buttons ---------- */

.field {
  display: grid;
  gap: var(--s-1);
}

.field__label {
  font-size: var(--t-sm);
  font-weight: var(--w-semibold);
}

.field__input {
  width: 100%;
  min-height: 48px;
  padding: var(--s-2) var(--s-3);
  border: var(--border-width) solid var(--line-strong);
  border-radius: var(--r-1);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: max(16px, 1rem);       /* iOS zooms the page on a smaller field */
  -webkit-appearance: none;
  appearance: none;
}

.field__input:focus-visible {
  outline-offset: 0;
}

.field__says {
  color: var(--problem);
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.field__says:empty {
  display: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: var(--s-2) var(--s-4);
  border: var(--border-width) solid var(--line-strong);
  border-radius: var(--r-1);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-weight: var(--w-semibold);
  text-decoration: none;
  cursor: pointer;
}

.btn--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}

.btn--wide {
  width: 100%;
  min-height: 48px;
}

.btn[aria-disabled="true"] {
  cursor: progress;
}

/* ---------- Tabs, tables, the map frame ---------- */

.tabs {
  display: flex;
  gap: var(--s-1);
  overflow-x: auto;
  border-bottom: var(--border);
}

.tab {
  flex: none;
  min-height: var(--tap);
  padding: var(--s-2) var(--s-4);
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-weight: var(--w-semibold);
  text-decoration: none;
  cursor: pointer;
}

.tab[aria-selected="true"],
.tab[aria-current="page"] {
  border-bottom-color: var(--accent);
  color: var(--accent);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.table th,
.table td {
  padding: var(--s-2);
  border-bottom: var(--border);
  text-align: left;
  vertical-align: top;
}

.table th {
  color: var(--ink-2);
  font-weight: var(--w-semibold);
}

.map {
  position: relative;
  overflow: hidden;
  border: var(--border);
  border-radius: var(--r-2);
  background: var(--grid);
  touch-action: pan-y;
}

/* ---------- SV2-21: the teacher, group, room, building map and staffing pages ----------

    .facts                 the header card's lines: a dl of div > dt + dd
    .days  .day            the day cards; side by side where there is room
    .row__period  .row__time  .row__mark   inside .row__when
    .part  .part__title    a titled part of a page
    .actions               a row of buttons
    .scroll                a table that may be wider than a phone
    .table--figures  .table__under
    .legend  .chip--none   the subject colours of a floor
    .plain                 a list that links nowhere
    .mapbox  .map__bar  .map__tabs  .map__zooms  .map__zoom
    .map__plan  .map__pulse  .map__says  .map__which  .map__ask
    .split__side           the map's place in .split
*/

.facts {
  display: grid;
  gap: var(--s-2);
  margin: 0;
}

.facts > div {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: var(--s-3);
  align-items: baseline;
}

.facts dt {
  color: var(--ink-2);
  font-size: var(--t-sm);
}

.facts dd {
  margin: 0;
}

.days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
  gap: var(--s-4);
  align-items: start;
}

.day .row {
  grid-template-columns: 6.75rem minmax(0, 1fr) auto;
}

.day .row__what,
.day .row__where {
  overflow-wrap: break-word;      /* a name breaks between its words before it breaks inside one */
}

.row__when {
  display: flex;
  flex-direction: column;
}

.row__period {
  color: var(--ink);
  font-weight: var(--w-semibold);
}

.row__mark {
  color: var(--accent);
  font-size: var(--t-xs);
  font-weight: var(--w-bold);
  letter-spacing: 0.08em;
  line-height: var(--lh-xs);
  text-transform: uppercase;
}

.part > * + * {
  margin-top: var(--s-2);
}

.part__title {
  color: var(--ink-2);
  font-size: var(--t-xs);
  font-weight: var(--w-bold);
  letter-spacing: 0.08em;
  line-height: var(--lh-xs);
  text-transform: uppercase;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.scroll {
  overflow-x: auto;
  border: var(--border);
  border-radius: var(--r-2);
  background: var(--card);
}

.scroll:focus-visible {
  outline-offset: 0;
}

.scroll .table th,
.scroll .table td {
  overflow-wrap: break-word;      /* a table wider than the phone scrolls; a word is not cut */
}

.scroll .table tr:last-child > * {
  border-bottom: 0;
}

.table tbody th,
.table tfoot th {
  color: var(--ink);
}

.table tfoot > tr > * {
  border-top: var(--border-width) solid var(--line-strong);
  font-weight: var(--w-semibold);
}

.table__under {
  display: block;
  margin-top: var(--s-1);
  font-weight: var(--w-regular);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.chip--none::before {
  border: var(--border-width) solid var(--line-strong);
  background: var(--room-default);
}

.plain {
  padding: var(--s-2) var(--s-4);
  border: var(--border);
  border-radius: var(--r-2);
  background: var(--card);
}

.plain > li + li {
  margin-top: var(--s-1);
}

.tab[aria-current="true"] {
  border-bottom-color: var(--accent);
  color: var(--accent);
}

.mapbox > * + * {
  margin-top: var(--s-2);
}

.map__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--s-2);
}

.map__tabs {
  flex: 1 1 auto;
  min-width: 0;
}

.map__zooms {
  flex: none;
  display: flex;
  gap: var(--s-1);
  margin-left: auto;
}

.map__zoom {
  min-width: var(--tap);
  padding: 0 var(--s-2);
}

.map__zoom[aria-disabled="true"] {
  border-color: var(--line);
  color: var(--ink-2);
  cursor: default;
}

.map__plan {
  display: block;
  width: 100%;
}

.map__pulse {
  position: absolute;
  border: 3px solid var(--accent);
  border-radius: var(--r-1);
  opacity: 0;
  pointer-events: none;
  animation: map-pulse 900ms var(--ease) 1;
}

@keyframes map-pulse {
  from {
    opacity: 0.9;
    transform: scale(1);
  }

  to {
    opacity: 0;
    transform: scale(1.9);
  }
}

@media (prefers-reduced-motion: reduce) {
  .map__pulse {
    animation: none;        /* the ring drawn on the plan stays */
  }
}

.map__says {
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

.map__which:empty {
  display: none;
}

.map__which > * + * {
  margin-top: var(--s-2);
}

.map__ask {
  font-weight: var(--w-semibold);
}

.split > * + * {
  margin-top: var(--s-4);
}

@media (min-width: 900px) {
  .split > * {
    grid-column: 1;
    margin-top: 0;
  }

  .split > .split__side {
    grid-column: 2;
    position: sticky;
    top: var(--s-4);
  }
}

/* ---------- end of SV2-21 ---------- */

/* ---------- The screens that are not a schedule: unlock, refusals ---------- */

.gate {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(var(--s-5), env(safe-area-inset-top, 0px)) max(var(--s-4), env(safe-area-inset-right, 0px)) max(var(--s-5), env(safe-area-inset-bottom, 0px)) max(var(--s-4), env(safe-area-inset-left, 0px));
}

.gate__card {
  width: 100%;
  max-width: 24rem;
  padding: var(--s-5);
  border: var(--border);
  border-top: var(--s-1) solid var(--accent);
  border-radius: var(--r-2);
  background: var(--card);
}

.gate__card > * + * {
  margin-top: var(--s-4);
}

.gate__title {
  font-size: var(--t-xl);
  line-height: var(--lh-xl);
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
}

.gate__title + .lede {
  margin-top: var(--s-2);
}

.gate__form {
  display: grid;
  gap: var(--s-4);
}

.gate__foot {
  padding-top: var(--s-4);
  border-top: var(--border);
  color: var(--ink-2);
  font-size: var(--t-sm);
  line-height: var(--lh-sm);
}

/* ---------- From a tablet up: 16 px. From 900 px the bar is a rail. ---------- */

@media (min-width: 640px) {
  html {
    font-size: var(--base);
  }
}

@media (min-width: 900px) {
  .app[data-state="open"],
  .app[data-state="open"][data-typing="true"] {
    padding-bottom: 0;
    padding-left: var(--rail-width);
  }

  .bar,
  .app[data-typing="true"] .bar {
    top: 0;
    right: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: var(--s-1);
    width: var(--rail-width);
    height: auto;
    padding: var(--s-4) 0;
    border-top: 0;
    border-right: var(--border);
  }

  .bar__item {
    flex: none;
    min-height: 64px;
  }

  .bar__item[aria-current="page"]::before {
    top: 18%;
    right: auto;
    bottom: 18%;
    left: 0;
    width: 3px;
    height: auto;
    border-radius: 0 var(--r-1) var(--r-1) 0;
  }

  .page {
    padding-top: var(--s-6);
  }

  .split {
    display: grid;
    grid-template-columns: minmax(0, var(--column)) minmax(0, 1fr);
    gap: var(--s-5);
    align-items: start;
  }

  .page:has(.split) {
    max-width: none;
  }
}

/* ---------- Paper: the frame is left off. Page layouts are the @media print block of SV2-23, below. ---------- */

@media print {
  .bar,
  .bands,
  .top {
    display: none;
  }

  .app[data-state="open"] {
    padding: 0;
  }
}

/* ---------- SV2-22: free now, where now, common planning, coverage, the substitute plan, directions ---------- */

/*
    .controls  .controls--row   the pickers of a page, one under another or side by side
    .pick  .pick__item          a choice of a few, one button each (the day type)
    .check                      a tick box and its words
    .stack                      cards one under another
    .chips  .chips__item        the teachers picked, each with its Remove
    .tag                        a word beside a name ("Same subject")
    .scroll                     a table wider than a phone, scrolled sideways
    .steps                      numbered directions
    .plain                      a list with no frame
    .notes                      a teacher's notes, line breaks kept
    .reminder                   the line to check with the office
    .row--plan                  a row of the substitute plan's day
    .actions                    a row of buttons; .no-print: left off paper
*/

.controls,
.stack {
  display: grid;
  gap: var(--s-4);
}

/* a grid's child is as wide as its widest word unless told otherwise */
.controls > *,
.stack > * {
  min-width: 0;
}

.controls:empty,
.stack:empty,
.no-print:empty {
  display: none;
}

.controls--row {
  grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
  align-items: end;
}

select.field__input {
  -webkit-appearance: menulist;
  appearance: auto;
}

.pick {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.pick > .field__label {
  padding: 0;
  margin-bottom: var(--s-1);
}

.pick__items {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.pick__item {
  position: relative;
  flex: 1 1 6rem;
  display: flex;
}

.pick__input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.pick__name {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: var(--s-2) var(--s-3);
  border: var(--border-width) solid var(--line-strong);
  border-radius: var(--r-1);
  background: var(--card);
  font-weight: var(--w-semibold);
  text-align: center;
}

/* The chosen one is marked by a heavier edge as well as by colour. */
.pick__input:checked + .pick__name {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.pick__input:focus-visible + .pick__name {
  outline: var(--focus-width) solid var(--focus);
  outline-offset: var(--focus-offset);
}

.check {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: var(--tap);
  cursor: pointer;
}

.check__input {
  flex: none;
  width: 24px;
  height: 24px;
  margin: 0;
  accent-color: var(--accent);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.chips[hidden] {
  display: none;
}

.chips__item {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding-left: var(--s-3);
  border: var(--border);
  border-radius: var(--r-1);
  background: var(--card);
  font-weight: var(--w-semibold);
}

.chips__remove {
  min-height: var(--tap);
  padding: 0 var(--s-3);
  border: 0;
  border-left: var(--border);
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: var(--t-sm);
  font-weight: var(--w-semibold);
  cursor: pointer;
}

.tag {
  display: inline-block;
  margin-left: var(--s-2);
  padding: 0 var(--s-2);
  border: var(--border-width) solid var(--accent);
  border-radius: var(--r-1);
  color: var(--accent);
  font-size: var(--t-xs);
  font-weight: var(--w-semibold);
  line-height: 1.5;
  vertical-align: middle;
}

.card__when,
.table__sub {
  display: block;
  color: var(--ink-2);
  font-size: var(--t-sm);
  font-weight: var(--w-regular);
  line-height: var(--lh-sm);
}

.scroll {
  overflow-x: auto;
}

.scroll .table th,
.scroll .table td {
  min-width: 6.5rem;
}

.table__row--all th,
.table__row--all td {
  background: var(--accent-soft);
}

.steps {
  padding-left: 1.75rem;
  list-style: decimal;
}

.steps__step {
  padding: var(--s-2) 0 var(--s-2) var(--s-1);
  border-bottom: var(--border);
}

.steps__step::marker {
  color: var(--ink-2);
  font-variant-numeric: var(--numeric);
  font-weight: var(--w-semibold);
}

/* every row of the plan starts its second column at the same place */
.row--plan {
  grid-template-columns: 10.5rem 1fr;
}

.plain > li + li {
  margin-top: var(--s-2);
}

.notes {
  white-space: pre-wrap;
}

.reminder {
  padding: var(--s-3) var(--s-4);
  border: var(--border);
  border-left: var(--s-1) solid var(--warning);
  border-radius: var(--r-1);
  background: var(--card);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2);
}

.card > .results__heading {
  margin-bottom: 0;
}

@media print {
  .actions,
  .no-print,
  .page .tabs {
    display: none;
  }

  .card {
    break-inside: avoid;
  }
}

/* ---------- SV2-22: end ---------- */

/* ---------- SV2-23: my schedule, notes, what a page hands over, the door sign, and paper ---------- */

/*
    The classes are listed at the top of this file. The screen first; every
    rule for paper is in the one print block at the end, which changes nothing
    on screen.
*/

.print-only {
  display: none;
}

}

}

}

.note__paper {

/* The door sign's preview: the printable part of a sheet, every size a share
   of the sheet's own width (cqw), so the sheet is shown whole at any width.

   Under 640 px the paper is the card (the number, the teacher, the subject,

   the size the page is read at: on a sheet 350 px wide its table would be
   set at 7 px. */
.sheet {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  max-width: 34rem;
  aspect-ratio: 7.4 / 9.9;
  border: var(--border-width) solid var(--line-strong);
  background: #ffffff;
  color: var(--ink);
}

.sign {
  display: flex;
  flex: 1 0 auto;
  flex-direction: column;
  align-items: center;
  padding: 1.9rem 1.25rem 1rem;
  padding: 9cqw 6cqw 5cqw;
  text-align: center;
}

.sign__card {
  display: contents;
}

.sign__word {
  color: var(--ink-2);
  font-family: var(--font-plan);
  font-size: 0.875rem;
  font-size: 4.1cqw;
  font-weight: var(--w-semibold);
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
}

.sign__number {
  max-width: 100%;
  font-family: var(--font-plan);
  font-size: calc(4.7rem * var(--sign-fit, 1));
  font-weight: var(--w-semibold);
  line-height: 1;
  overflow-wrap: anywhere;
}

@supports (font-size: 1cqw) {
  .sign__number {
    font-size: calc(22.5cqw * var(--sign-fit, 1));
  }
}

.sign__teacher {
  margin-top: 0.85rem;
  margin-top: 4cqw;
  font-size: 1.25rem;
  font-size: 6cqw;
  font-weight: var(--w-bold);
  line-height: 1.15;
}

.sign__subject {
  margin-top: 0.3rem;
  margin-top: 1.5cqw;
  color: var(--ink-2);
  font-size: 0.875rem;
  font-size: 4.1cqw;
  line-height: 1.2;
}

/* The kinds of day stand side by side while each table has room for its
   longest words, and one under another when it has not: a kind is never
   narrower than its table can be without cutting a word. */
.sign__day {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  gap: 3cqw;
  order: 1;
  width: 100%;
  margin-top: 1rem;
  margin-top: 5cqw;
  text-align: left;
}

.sign__kind {
  flex: 1 1 42%;
  min-width: min-content;
  max-width: 100%;
}

.sign__kindname {
  font-size: 0.8rem;
  font-size: 2.6cqw;
  font-weight: var(--w-bold);
  line-height: 1.3;
}

.sign__table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.75rem;
  font-size: 2.06cqw;
  font-variant-numeric: var(--numeric);
  line-height: 1.3;
}

/* A word is never cut ("Emp ty"), not a teacher's name of thirty letters and
   not the period's: a column is as wide as its longest word and a line breaks
   between words only. The period's own cell wraps between its words too, so a
   long one does not push the table off the sheet. (The page breaks words
   anywhere; a table cell takes that back.) The one word that is cut is a name
   too long for the sheet to hold: the rule after these. */
.sign__table th,
.sign__table td {
  padding: 0.15rem 0.25rem 0.15rem 0;
  padding: 0.6cqw 1.2cqw 0.6cqw 0;
  border-top: 1px solid var(--line);
  font-weight: var(--w-regular);
  text-align: left;
  vertical-align: top;
  overflow-wrap: normal;
}

.sign__table th {
  font-weight: var(--w-semibold);
}

/* A name somebody typed stands in a box of its own, at most 36% of the sheet
   wide: the room two names have side by side, with the period and the time
   beside them. A word that fits that is whole, and its column is as wide as
   it. A longer one is broken at that width, because a word past the sheet's
   edge is not read at all: never past the sheet wins over never cut. (About

  display: inline-block;
  max-width: 12rem;
  max-width: 36cqw;
  overflow-wrap: break-word;
  vertical-align: top;
}

.sign__school {
  order: 2;
  margin-top: auto;
  padding-top: 1rem;
  padding-top: 5cqw;
  color: var(--ink-2);
  font-size: 0.75rem;
  font-size: 2.3cqw;
  line-height: 1.3;
}

@media screen and (max-width: 639.98px) {
  .sheet {
    display: block;
    aspect-ratio: auto;
    border: 0;
    background: none;
  }

  .sign {
    display: block;
    padding: 0;
  }

  .sign__card {
    display: flex;
    flex-direction: column;
    align-items: center;
    aspect-ratio: 7.4 / 9.9;
    padding: 1.9rem 1.25rem 1rem;
    padding: 9cqw 6cqw 5cqw;

    flex-wrap: nowrap;
    gap: var(--s-4);
    margin-top: var(--s-3);
    padding: var(--s-3);
    border: var(--border-width) solid var(--line-strong);

  }

  /* On a phone a period is not a row of four columns: its name and its time
     are one line, who is in the room is the next, and who teaches them the
     one after, each as wide as the frame. So a word is cut only when it is
     longer than a whole line, and nothing is moved sideways to be read: a
     frame that scrolled could not be reached with a keyboard. */
  .sign__kind {
    flex: none;
    min-width: 0;
  }

  .sign__kindname {
    font-size: var(--t-md);
  }

  .sign__table {
    display: block;
    font-size: var(--t-md);
  }

  .sign__table tbody {
    display: block;
  }

  .sign__table tr {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: var(--s-3);
    padding: var(--s-1) 0;
    border-top: 1px solid var(--line);
  }

  .sign__table th,
  .sign__table td {
    min-width: 0;
    padding: 0;
    border-top: 0;
    overflow-wrap: break-word;
  }

  .sign__table td:nth-of-type(n + 2) {
    grid-column: 1 / -1;
  }

  .sign__table td:empty {
    display: none;
  }

  .sign__table td span {
    max-width: 100%;
  }
}

/* ---- Paper. A page is headed by the school (the frame's own line), what the
   page is (its heading) and the date it was printed; everything a finger
   presses is left off; a page is one plain column. Two pages have a layout of
   their own: a teacher's schedule (the day types side by side, on one sheet)
   and the door sign (the sheet and nothing else). The substitute plan keeps
   the single column SV2-22 gave it. ---- */

@page {
  margin: 14mm;
}

/* The door sign's sheet is upright whatever the reader's print dialog says:
   it is printed on a page named for it, and that page is portrait on the
   paper the dialog chose. (Measured in Chromium PDFs with landscape asked:
   one upright sheet of US Letter and of A4. A browser that does not know
   named pages prints the sign as its dialog says, as before.) */
@page sign {
  size: portrait;
}

@media print {
  /* paper is light whatever the screen is */
  :root,
  [data-theme] {
    color-scheme: light;
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2328;
    --ink-2: #515761;
    --line: #d8d3c8;
    --line-strong: #857f73;
    --accent: #0f6e66;
    --accent-ink: #ffffff;
    --accent-soft: #d9ece9;
    --problem: #b3261e;
    --warning: #925d00;
    --note: #3b5b8a;
    --grid: #e8e3d8;
    --corridor: #ffffff;
    --map-corridor: #ffffff;
    --stairs: #d9ece9;
    --room-default: #e9e4d9;
  }

  html {
    font-size: 11pt;
  }

  .print-only {
    display: block;
  }

  .app[data-state="open"] {
    display: block;
    min-height: 0;
  }

  /* the header: the school, then (in the page) the date and the heading */
  .top {
    display: block;
    min-height: 0;
    padding: 0 0 1mm;
    border: 0;
    background: none;
  }

  .top__school {
    display: inline;
    min-height: 0;
    font-size: 10pt;
  }

  .page__printed {
    color: var(--ink-2);
    font-size: 9pt;
  }

  .page__printed + .page__title {
    margin-top: 2mm;
  }

  .page {
    max-width: none;
    padding: 0;
  }

  .foot {
    max-width: none;
    margin-top: 6mm;
    padding: 2mm 0 0;
    font-size: 8pt;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* nothing a finger presses, and no mark of what the screen was doing */
  button,
  .btn,
  .page__outputs,
  .outputs,
  .controls,
  .page__body > .field,
  .page__body > .pick,
  .field--search,
  .map__bar,
  .map__which,
  .map__pulse,
  .row__mark,
  .chips__remove {
    display: none;
  }

  /* the substitute plan's date is a line of words on paper (.sub__date); the
     field it was chosen in stays behind with the other controls. Every
     teacher who could cover is named: .sub__rest is hidden on screen only. */
  .sub__date {
    font-weight: var(--w-semibold);
  }

  .row--now {
    margin: 0;
    padding-right: 0;
    padding-left: 0;
    border-left: 0;
    background: none;
  }

  /* one plain column */
  .split {
    display: block;
  }

  .split > * + * {
    margin-top: var(--s-4);
  }

  .split > .split__side {
    position: static;
  }

  .days {
    grid-template-columns: minmax(0, 1fr);
  }

  .scroll {
    overflow: visible;
    border: 0;
  }

  .row {
    min-height: 0;
    padding: 1.2mm 0;
  }

  .card {
    padding: 3mm;
  }

  /* a note prints as it was typed, and only when there is one */
  .days[data-notes] .note__input,
  .days[data-notes] .note__count,
  .days[data-notes] .note[data-empty="true"] {
    display: none;
  }

  .days[data-notes] .note__paper {
    display: block;
  }

  .page[data-view="me"] .days {
    grid-template-columns: none;
    grid-auto-columns: minmax(0, 1fr);
    grid-auto-flow: column;
    gap: 5mm;

  .page[data-view="teacher"] .split__side,
  .page[data-view="me"] .split__side,
  .page[data-view="teacher"] .part,
  .page[data-view="me"] .part {
    display: none;
  }

  .app[data-view="door"] .foot {
    display: none;
  }

     name stands at the foot of the sheet as it does in the preview. The
     paper is the reader's own choice in their print dialog (this page has no
     paper setting): on paper 100vh is the page inside its margins, 251 mm of

    max-width: none;
    min-height: calc(100vh - 3mm);
    aspect-ratio: auto;
    border: 0;
    break-inside: avoid;
  }

  .sign {
    padding: 12mm 0 0;
  }

  .sign__word {
    font-size: 22pt;
  }

  .sign__number {
    font-size: calc(120pt * var(--sign-fit, 1));
  }

  .sign__teacher {
    margin-top: 8mm;
    font-size: 32pt;
  }

  .sign__subject {
    margin-top: 3mm;
    font-size: 22pt;
  }

     kinds of day the sign is 860 px of a 950 px sheet, and the planner's
     batch, which sets the same sign, needs 62 px of that for its preview */

    gap: 6mm;
    margin-top: 8mm;
  }

  .sign__kindname {
    font-size: 14pt;
  }

  .sign__table {
    font-size: 11pt;
  }

  .sign__table th,
  .sign__table td {
    padding: 1mm 2mm 1mm 0;
    border-top: 0.2mm solid var(--line);
  }

  .sign__school {
    padding-top: 8mm;
    font-size: 12pt;
  }

/* ---------- SV2-45: the M4 pass ---------- */

/*
    .row__time             one line always: "8:00 AM to 8:48 AM" never breaks

                           "That page is not in this schedule.")
    .sub__date             the substitute plan's date on paper
    .sub__rest             the teachers past the first three who could cover:
                           on paper only
    --map-corridor         the staff map's corridor (the tokens above)
*/

/* A period's times stay on one line, "8:00 AM to 8:48 AM" whole. In a wide
   card a row is three columns: when, what, where; with subgrid the columns
   are the card's, as wide as its widest time, so every row lines up. In a
   narrow card (a phone, or two day types side by side) the times would take
   half the row and squeeze a teacher's name into a sliver, so the period and
   its times are one line across the top and what and where share the line
   under it. */
.row__time {
  white-space: nowrap;
}

.day {
  container-type: inline-size;
}

.day .row {
  grid-template-columns: max-content minmax(0, 1fr) auto;
}

@supports (grid-template-columns: subgrid) {
  .day .rows {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr) auto;
    column-gap: var(--s-3);
  }

  .day .row {
    grid-column: 1 / -1;
    grid-template-columns: subgrid;
  }
}

@container (max-width: 30rem) {
  .day .rows {
    display: block;
  }

  .day .row {
    grid-template-columns: minmax(0, 1fr) minmax(0, auto);
    row-gap: 0;
  }

  .day .row__when {
    grid-column: 1 / -1;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: var(--s-2);
  }
}

/* A row that is taken off the page is off it, whatever its class lays out. */
.actions[hidden],
.page__outputs[hidden] {
  display: none;
}

.notice {
  margin: 0 0 var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-left: var(--s-1) solid var(--note);
  border-radius: var(--r-1);
  background: var(--note-paper);
  color: var(--ink);
}

/* (screen only: this block stands after the paper rules, and would undo them) */
@media screen {
  .sub__rest {
    display: none;
  }
}

/* Under a finger a link in a row or a table is 44 px high, by padding and not
   by its type. The link is a box of its own, so a name that wraps keeps its
   lines together inside one target, and two names one above the other in a
   cell are a whole target apart: neither covers the other. The box is never
   wider than the cell it is in, so a long name still breaks inside it. On
   paper a link is as tall as its words. */
@media screen and (pointer: coarse), screen and (max-width: 639.98px) {
  .row a,
  .table a {
    display: inline-block;
    max-width: 100%;
    padding-block: calc((var(--tap) - 1.5em) / 2);   /* where the browser has no lh unit */
    padding-block: calc((var(--tap) - 1lh) / 2);
    vertical-align: middle;
  }

  /* the link brings its own room above and below, so the row gives less,
     and in a narrow card the line of links sits close under the times */
  .day .row {
    padding-block: var(--s-1);
  }

  @container (max-width: 30rem) {
    .day .row__when {
      margin-bottom: -6px;
    }
  }
}

/* ---------- SV2-45: end ---------- */

const searchView = {

      class: 'field__input field__input--search',

      autocomplete: 'off',
      autocapitalize: 'off',

// The names of a kind of day: "A Day", or "A Day and B Day" when they are the
// same.
function kindName(kind) {
  return wordsJoined(kind.dayTypes.map((dayType) => typed(dayType.name)));
}

// The day as cards, one per kind of day. `rowOf(dayType, period)` gives
// { what, where } for a row: text or nodes.
function dayCardsOf(ctx, kinds, rowOf) {
  const school = ctx.school;
  const cards = kinds.map((kind) => {
    const bells = school.bells(kind.first.id);
    const current = nowPeriodOf(ctx, kinds, kind);
    const rows = bells.map((bell, period) => {
      const row = rowOf(kind.first, period);
      return h('li', { class: period === current ? 'row row--now' : 'row', dataset: { period: String(period) } },
        h('span', { class: 'row__when' },
          h('span', { class: 'row__period' }, school.periodName(period)),
          bell.start && bell.end ? h('span', { class: 'row__time' }, school.time(bell.start) + ' to ' + school.time(bell.end)) : null,
          period === current ? h('span', { class: 'row__mark' }, 'Now') : null),
        h('span', { class: 'row__what' }, row.what),
        h('span', { class: 'row__where' }, row.where));
    });
    return h('section', { class: 'card day', dataset: { days: kind.dayTypes.map((dayType) => dayType.id).join(' ') } },
      h('h2', { class: 'card__title' }, kindName(kind)),
      h('ol', { class: 'rows' }, rows));
  });
  return h('div', { class: 'days', dataset: { count: String(cards.length) } }, cards);
}

// Where a slot is, as a room page's link, or the words kept for a room that
// is not in the building.
function slotWhere(school, slot) {
  const room = slot && slot.room ? school.room(slot.room) : null;
  if (room) return linkToRoom(school, room, true);
  const text = slot && typeof slot.roomText === 'string' ? slot.roomText : '';
  return text === '' ? h('span', { class: 'muted' }, 'No room') : h('span', null, typed(text), ' · not in the building');
}

// ---- the teacher's own sentence

// "Teaches 5 classes. Planning is Block B on A Day and Block D on B Day."
// Parts, for partsToNodes() and partsToText().
function teacherSummaryOf(school, teacherId) {
  const days = school.dayTypes.map((dayType) => {
    const day = school.teacherDay(teacherId, dayType.id) || [];
    return { name: dayType.name, classes: day.filter((entry) => entry.kind === 'teaching').length, planning: day.filter((entry) => entry.kind === 'planning').map((entry) => entry.period) };
  });
  if (days.length === 0 || days.every((day) => day.classes === 0)) return ['Has no classes in this schedule.'];
  const parts = [];
  const each = (say, joiner) => {
    days.forEach((day, at) => {
      if (at > 0) parts.push(joiner || (at === days.length - 1 ? ' and ' : ', '));
      parts.push(say(day, at), ' on ', { typed: day.name });
    });
  };

  if (days.every((day) => day.classes === days[0].classes)) parts.push('Teaches ' + countOf(days[0].classes, 'class', 'classes'));
  else {
    parts.push('Teaches ');
    each((day, at) => (at === 0 ? countOf(day.classes, 'class', 'classes') : String(day.classes)));
  }
  parts.push('. ');

  const same = days.every((day) => day.planning.join() === days[0].planning.join());
  const names = (day) => wordsJoined(day.planning.map((period) => school.periodName(period))).join('');
  if (days.some((day) => day.planning.length > 3)) {
    // a long list of periods is counted instead of named
    if (days.every((day) => day.planning.length === days[0].planning.length)) parts.push('Has ' + countOf(days[0].planning.length, 'planning period', 'planning periods'));
    else {
      parts.push('Has ');
      each((day, at) => (at === 0 ? countOf(day.planning.length, 'planning period', 'planning periods') : String(day.planning.length)));
    }
  } else if (same) {
    parts.push(days[0].planning.length === 0 ? 'Has no planning period' : 'Planning is ' + names(days[0]));
  } else {
    parts.push('Planning is ');
    each((day) => (day.planning.length === 0 ? 'none' : names(day)), days.some((day) => day.planning.length > 1) ? '; ' : null);
  }
  parts.push('.');
  return parts;
}

// The teachers who have any of this teacher's groups, with the groups shared:
// [{ teacher, groups }] in the school's own order.
function sharersOf(school, teacherId) {
  const taught = groupsTaught(school);
  const mine = taught.get(teacherId) || new Set();
  const out = [];
  for (const other of school.teachers) {
    if (other.id === teacherId) continue;
    const shared = school.groups.filter((group) => mine.has(group.id) && taught.get(other.id).has(group.id));
    if (shared.length > 0) out.push({ teacher: other, groups: shared });
  }
  return out;
}

// A teacher's page. `heading` is for the reader's own ("My schedule"): the
// name then starts the sentence under it. Left out, the heading is the name.
function teacherPageOf(ctx, teacher, heading) {
  const school = ctx.school;
  const rooms = (teacher.roomIds || []).map((id) => school.room(id)).filter(Boolean);

  const header = h('section', { class: 'card', 'aria-label': 'About' },
    h('dl', { class: 'facts' },
      h('div', null, h('dt', null, 'Subject'), h('dd', null, subjectChipOf(school.subject(teacher.subjectId)))),
      h('div', null, h('dt', null, rooms.length > 1 ? 'Rooms' : 'Room'),
        h('dd', null, rooms.length === 0 ? h('span', { class: 'muted' }, 'No room of their own') : wordsJoined(rooms.map((room) => {
          const floor = school.floorOfRoom(room.id);
          return h('span', null, linkToRoom(school, room, true), floor ? [' · ', typed(floor.name)] : null);
        }))))));

  const slotOf = (dayType, taught, period) => school.groupDay(taught.groupId, dayType.id)[period];
  const kinds = dayKindsOf(school, (dayType) => (school.teacherDay(teacher.id, dayType.id) || []).map((entry) => entry.groups.map((taught) => {
    const slot = slotOf(dayType, taught, entry.period);
    return [taught.groupId, taught.roomId, slot.label, slot.roomText];
  })));
  const days = dayCardsOf(ctx, kinds, (dayType, period) => {
    const entry = school.teacherDay(teacher.id, dayType.id)[period];
    if (entry.kind === 'planning') return { what: h('span', { class: 'muted' }, 'Planning'), where: null };
    const what = [];
    const where = [];
    const seen = new Set();
    for (const taught of entry.groups) {
      const group = school.group(taught.groupId);
      const slot = slotOf(dayType, taught, period);
      what.push(h('span', null, linkToGroup(school, group), slot.label ? [' ', h('span', { class: 'muted' }, typed(slot.label))] : null));
      const key = taught.roomId || 'text:' + slot.roomText;
      if (!seen.has(key)) where.push(slotWhere(school, slot));
      seen.add(key);
    }
    return { what: wordsJoined(what), where: wordsJoined(where) };
  });

  const map = rooms.length > 0 && school.has('map') ? floorMap(ctx, {
    floorId: school.floorOfRoom(rooms[0].id).id,
    label: 'Where ' + teacher.name + ' is',
    marks: rooms.map((room) => ({ roomId: room.id, ring: true })),
    says: (floor) => {
      const here = rooms.filter((room) => school.floorOfRoom(room.id).id === floor.id);
      if (here.length === 0) return [typed(teacher.name), ' has no room on ', typed(floor.name), '.'];
      return [...wordsJoined(here.map((room) => linkToRoom(school, room, true))), here.length === 1 ? ' is ringed.' : ' are ringed.'];
    },
  }) : null;

  const taught = groupsTaught(school).get(teacher.id);
  const groups = school.groups.filter((group) => taught.has(group.id));
  const sharers = sharersOf(school, teacher.id);
  const more = [
    school.has('coverage') ? h('a', { class: 'btn', href: makeHash('coverage', teacher.id) }, 'Coverage') : null,
    school.has('sub') ? h('a', { class: 'btn', href: makeHash('sub', teacher.id) }, 'Substitute plan') : null,
  ].filter(Boolean);

  const after = [
    groups.length > 0 ? listPart('Groups taught', groups.map((group) => h('li', null,
      h(school.has('group') ? 'a' : 'span', { class: 'list__link', href: school.has('group') ? makeHash('group', group.id) : null },
        h('span', { class: 'list__name' }, typed(group.name)),
        group.grade ? h('span', { class: 'list__detail' }, 'Grade ', typed(group.grade)) : null)))) : null,
    sharers.length > 0 ? listPart('Teachers who share these groups', sharers.map((sharer) => h('li', null,
      h('a', { class: 'list__link', href: makeHash('teacher', sharer.teacher.id) },
        h('span', { class: 'list__name' }, typed(sharer.teacher.name)),
        h('span', { class: 'list__detail' }, 'Shares ', wordsJoined(sharer.groups.map((group) => typed(group.name)))))))) : null,
    more.length > 0 ? h('p', { class: 'actions' }, more) : null,
    teacherOutputs(ctx, teacher, kinds),
  ];
  const notes = isMe(ctx, teacher.id) ? noteFields(ctx, days) : null;
  const summary = partsToNodes(teacherSummaryOf(school, teacher.id));
  return pageOf(heading || typed(teacher.name), heading ? [typed(teacher.name), '. ', summary] : summary,
    map ? besideMap([header, days, notes], map, after) : [header, days, notes, after]);
}

const teacherView = {
  id: 'teacher',
  flag: 'teacher',
  nav: 'search',
  title(ctx, route) {
    const found = ctx.school.teacher(route.id);
    return found ? found.name : 'Teacher';
  },
  render(ctx, route) {
    const teacher = ctx.school.teacher(route.id);
    return teacher ? teacherPageOf(ctx, teacher, null) : missingPage('teacher');
  },
};
return { wordsJoined, partsToText, partsToNodes, countOf, linkToTeacher, linkToGroup, linkToRoom, subjectChipOf, listPart, teachersOfSlot, dayKindsOf, nowPeriodOf, kindName, dayCardsOf, slotWhere, teacherSummaryOf, sharersOf, teacherPageOf, teacherView };
})();
// ---- staff/views/group.js
const { groupTeaching, groupSummaryOf, groupView } = (() => {
// #/group/g…  Group
//
// Name and grade (never a head count: a published file has none); a table of
// who teaches the group, with subject, teacher, room and the periods on each
// day type; the group's day in order; and a map of where the group goes, each
// room badged with its period and time, for each day type.






const isEmpty = (slot) => !slot || (!slot.room && !slot.roomText && !slot.label);

// Who teaches the group: one row for each teacher in each room, in the order
// the day meets them, with the periods on each kind of day.
// [{ teacher, room, text, label, periods: [[period, …] per kind] }]
function groupTeaching(school, groupId, kinds) {
  const rows = [];
  const byKey = new Map();
  kinds.forEach((kind, at) => {
    const day = school.groupDay(groupId, kind.first.id);
    day.forEach((slot, period) => {
      if (isEmpty(slot)) return;
      const room = slot.room ? school.room(slot.room) : null;
      const teachers = teachersOfSlot(school, kind.first.id, groupId, period);
      for (const teacher of teachers.length > 0 ? teachers : [null]) {
        const key = JSON.stringify([teacher ? teacher.id : '', room ? room.id : slot.roomText, teacher || room ? '' : slot.label]);
        if (!byKey.has(key)) {
          byKey.set(key, { teacher, room, text: room ? '' : slot.roomText, label: slot.label, periods: kinds.map(() => []) });
          rows.push(byKey.get(key));
        }
        byKey.get(key).periods[at].push(period);
      }
    });
  });
  return rows;
}

// "Grade 6. Taught by 7 teachers in 8 rooms." Parts, as teacherSummaryOf().
function groupSummaryOf(school, group, rows) {
  const parts = [];
  if (group.grade) parts.push('Grade ', { typed: group.grade }, '. ');
  const teachers = new Set(rows.filter((row) => row.teacher).map((row) => row.teacher.id)).size;
  const rooms = new Set(rows.filter((row) => row.room).map((row) => row.room.id)).size;
  if (rows.length === 0) parts.push('Has nothing scheduled in this copy.');
  else parts.push('Taught by ' + countOf(teachers, 'teacher', 'teachers') + ' in ' + countOf(rooms, 'room', 'rooms') + '.');
  return parts;
}

function teachingTable(school, kinds, rows) {
  const subjectOf = (row) => {
    const subject = school.subject(row.teacher ? row.teacher.subjectId : null) || school.subject(row.room ? row.room.subjectId : null);
    if (subject) return subjectChipOf(subject);
    return row.label ? typed(row.label) : h('span', { class: 'muted' }, 'No subject');
  };
  return h('div', { class: 'scroll', role: 'region', tabindex: '0', 'aria-label': 'The table of who teaches this group' },
    h('table', { class: 'table' },
      h('thead', null, h('tr', null,
        h('th', { scope: 'col' }, 'Subject'),
        h('th', { scope: 'col' }, 'Teacher'),
        h('th', { scope: 'col' }, 'Room'),
        kinds.map((kind) => h('th', { scope: 'col' }, kindName(kind))))),
      h('tbody', null, rows.map((row) => h('tr', null,
        h('td', null, subjectOf(row)),
        h('td', null, row.teacher ? linkToTeacher(school, row.teacher) : h('span', { class: 'muted' }, 'No teacher')),
        h('td', null, row.room ? linkToRoom(school, row.room, true) : slotWhere(school, { room: null, roomText: row.text })),
        row.periods.map((periods) => h('td', null, periods.length === 0 ? h('span', { class: 'muted' }, 'None') : periods.map((period) => school.periodName(period)).join(', '))))))));
}

// The rooms a kind of day takes the group to, with their periods:
// [{ room, periods }] in the order met.
function visits(school, groupId, kind) {
  const out = [];
  school.groupDay(groupId, kind.first.id).forEach((slot, period) => {
    const room = slot && slot.room ? school.room(slot.room) : null;
    if (!room) return;
    let visit = out.find((each) => each.room.id === room.id);
    if (!visit) {
      visit = { room, periods: [] };
      out.push(visit);
    }
    visit.periods.push(period);
  });
  return out;
}

function groupMap(ctx, group, kinds, at) {
  const school = ctx.school;
  const kind = kinds[at];
  const seen = visits(school, group.id, kind);
  if (seen.length === 0) return null;
  const bells = school.bells(kind.first.id);
  const timeOf = (period) => (bells[period].start ? school.time(bells[period].start) : '');
  const shorts = (visit) => visit.periods.map((period) => school.periodLabel(period)).join(', ');
  const box = h('div', { class: 'part', dataset: { kind: String(at) } });
  const tabs = kinds.length > 1 ? h('div', { class: 'tabs' }, kinds.map((each, index) => h('button', {
    class: 'tab',
    type: 'button',
    'aria-current': index === at ? 'true' : null,
    dataset: { kind: String(index) },
    onclick: () => {
      const next = groupMap(ctx, group, kinds, index);
      if (!next) return;
      box.replaceWith(next);
      next.querySelector('.tab[aria-current]').focus();
    },
  }, kindName(each)))) : null;
  box.append(...[
    h('h2', { class: 'part__title' }, 'Where ', typed(group.name), ' goes'),
    tabs,
    floorMap(ctx, {
      floorId: school.floorOfRoom(seen[0].room.id).id,
      label: 'Where ' + group.name + ' goes',
      marks: seen.map((visit) => ({ roomId: visit.room.id, ring: false, short: shorts(visit), badge: (shorts(visit) + ' ' + timeOf(visit.periods[0])).trim() })),
      says: (floor) => {
        const here = seen.filter((visit) => school.floorOfRoom(visit.room.id).id === floor.id);
        if (here.length === 0) return ['Nothing of this day is on ', typed(floor.name), '.'];
        return ['On ', typed(floor.name), ': ', ...wordsJoined(here.map((visit) => h('span', null,
          linkToRoom(school, visit.room, true), ' (', visit.periods.map((period) => school.periodName(period) + (timeOf(period) ? ' at ' + timeOf(period) : '')).join(', '), ')'))), '.'];
      },
    }),
  ].filter(Boolean));
  return box;
}

const groupView = {
  id: 'group',
  flag: 'group',
  nav: 'search',
  title(ctx, route) {
    const found = ctx.school.group(route.id);
    return found ? found.name : 'Group';
  },
  render(ctx, route) {
    const school = ctx.school;
    const group = school.group(route.id);
    if (!group) return missingPage('group');

    const kinds = dayKindsOf(school, (dayType) => school.groupDay(group.id, dayType.id).map((slot, period) => [slot.room, slot.roomText, slot.label, teachersOfSlot(school, dayType.id, group.id, period).map((teacher) => teacher.id)]));
    const rows = groupTeaching(school, group.id, kinds);

    const header = h('section', { class: 'card', 'aria-label': 'About' },
      h('dl', { class: 'facts' },
        h('div', null, h('dt', null, 'Group'), h('dd', null, h('span', { class: 'chip', style: /^#[0-9a-f]{6}$/i.test(group.colour) ? '--chip: ' + group.colour : null }, typed(group.name)))),
        h('div', null, h('dt', null, 'Grade'), h('dd', null, group.grade ? typed(group.grade) : h('span', { class: 'muted' }, 'Not given')))));

    const teaching = rows.length > 0 ? h('section', { class: 'part', 'aria-label': 'Who teaches this group' },
      h('h2', { class: 'part__title' }, 'Who teaches ', typed(group.name)),
      teachingTable(school, kinds, rows)) : null;

    const days = dayCardsOf(ctx, kinds, (dayType, period) => {
      const slot = school.groupDay(group.id, dayType.id)[period];
      if (isEmpty(slot)) return { what: h('span', { class: 'muted' }, 'Nothing scheduled'), where: null };
      const teachers = teachersOfSlot(school, dayType.id, group.id, period).map((teacher) => linkToTeacher(school, teacher));
      const what = wordsJoined(teachers);
      if (slot.label) what.push(teachers.length > 0 ? ' ' : '', h('span', { class: teachers.length > 0 ? 'muted' : null }, typed(slot.label)));
      if (what.length === 0) what.push(h('span', { class: 'muted' }, 'No teacher'));
      return { what, where: slotWhere(school, slot) };
    });

    const map = school.has('map') ? groupMap(ctx, group, kinds, 0) : null;
    return pageOf(typed(group.name), partsToNodes(groupSummaryOf(school, group, rows)),
      map ? besideMap([header, teaching, days], map, []) : [header, teaching, days]);
  },
};
return { groupTeaching, groupSummaryOf, groupView };
})();
// ---- staff/views/room.js
const { roomUse, roomSummaryOf, roomView } = (() => {
// #/room/r…  Room
//
// Every room has a page, with or without a teacher: who is in it each period
// on each day type and when it is empty, its subject, capacity and features,
// and where it is on the map.







// Who is in a room in each period of a day type: one list per period of
// { group, label, teachers }, in the school's own order of groups. Two groups
// in one period are both there: a double-booking is shown as it is.
function roomUse(school, roomId, dayTypeId) {
  const periods = school.bells(dayTypeId).map(() => []);
  for (const group of school.groups) {
    school.groupDay(group.id, dayTypeId).forEach((slot, period) => {
      if (!slot || slot.room !== roomId || !periods[period]) return;
      periods[period].push({ group, label: slot.label, teachers: teachersOfSlot(school, dayTypeId, group.id, period) });
    });
  }
  return periods;
}

// "On Floor 2. In use for 5 of 8 periods on A Day and 6 on B Day." Parts.
function roomSummaryOf(school, room) {
  const floor = school.floorOfRoom(room.id);
  const parts = floor ? ['On ', { typed: floor.name }, '. '] : [];
  const days = school.dayTypes.map((dayType) => {
    const use = roomUse(school, room.id, dayType.id);
    return { name: dayType.name, used: use.filter((period) => period.length > 0).length, of: use.length };
  });
  if (days.every((day) => day.used === 0)) return parts.concat('Not used in this schedule.');
  if (days.every((day) => day.used === days[0].used)) return parts.concat('In use for ' + days[0].used + ' of ' + countOf(days[0].of, 'period', 'periods') + '.');
  parts.push('In use for ');
  days.forEach((day, at) => {
    if (at > 0) parts.push(at === days.length - 1 ? ' and ' : ', ');
    parts.push(at === 0 ? day.used + ' of ' + countOf(day.of, 'period', 'periods') : String(day.used), ' on ', { typed: day.name });
  });
  parts.push('.');
  return parts;
}

    }) : null;

return { roomUse, roomSummaryOf, roomView };

// ---- staff/views/map.js
const { roomsInOrder, floorLegend, mapView } = (() => {
// #/map/f…  Building map
//
// One floor at a time, with floor tabs. Rooms are coloured by subject, with a
// legend, and carry their numbers; a tap on a room opens its page. Beside the
// picture is the same floor in words: every room as a link, then the other
// spaces. Everything the picture shows is in that list.







// A floor's rooms in the order a person looks them up: by number, numbers
// counted as numbers, then the rooms with none.
function roomsInOrder(floor) {
  const rooms = floor.spaces.filter((space) => space.kind === 'room');
  return rooms.sort((a, b) => {
    const blank = (a.number.trim() === '') - (b.number.trim() === '');
    return blank !== 0 ? blank : a.number.localeCompare(b.number, 'en', { numeric: true, sensitivity: 'base' });
  });
}

// The subjects a floor's rooms have, in the school's own order, and whether
// any room has none.
function floorLegend(school, floor) {
  const rooms = floor.spaces.filter((space) => space.kind === 'room');
  return {
    subjects: school.subjects.filter((subject) => rooms.some((room) => room.subjectId === subject.id)),
    none: rooms.some((room) => !school.subject(room.subjectId)),
  };
}

const mapView = {
  id: 'map',
  flag: 'map',
  nav: 'map',
  title(ctx, route) {

  },
  render(ctx, route) {
    const school = ctx.school;
    const floor = route.id ? school.floor(route.id) : school.floors[0];
    if (!floor) return missingPage('floor');
    const rooms = roomsInOrder(floor);
    const others = floor.spaces.filter((space) => space.kind !== 'room');
    const names = school.data.publish.teacherNamesOnMap !== false;
    const legend = floorLegend(school, floor);

    const map = floorMap(ctx, {
      floorId: floor.id,
      label: 'Building map',
      floorHref: (each) => makeHash('map', each.id),

      legend.subjects.map((subject) => h('li', null, subjectChipOf(subject))),
      legend.none ? h('li', null, h('span', { class: 'chip chip--none' }, 'No subject')) : null);

    const detail = (room) => {
      const said = [];
      const subject = school.subject(room.subjectId);
      if (subject) said.push(typed(subject.name));
      if (names) {
        for (const id of room.teacherIds || []) {
          const teacher = school.teacher(id);
          if (teacher) said.push(typed(teacher.name));
        }
      }
      return said.length > 0 ? h('span', { class: 'list__detail' }, said.map((each, at) => (at > 0 ? [' · ', each] : each))) : null;
    };
    const tag = school.has('room') ? 'a' : 'span';
    const list = rooms.length > 0 ? listPart('Rooms on this floor', rooms.map((room) => h('li', null,
      h(tag, { class: 'list__link', href: school.has('room') ? makeHash('room', room.id) : null, dataset: { room: room.id } },
        h('span', { class: 'list__name' }, typed(school.roomName(room, true))),
        detail(room))))) : h('p', { class: 'muted' }, 'No rooms are drawn on this floor.');
    const rest = others.length > 0 ? h('section', { class: 'part', 'aria-label': 'Other spaces on this floor' },
      h('h2', { class: 'part__title' }, 'Other spaces on this floor'),
      h('ul', { class: 'plain' }, others.map((space) => h('li', null, space.label ? typed(space.label) : h('span', { class: 'muted' }, 'A space with no name'))))) : null;

    const lede = [typed(floor.name), ' has ' + countOf(rooms.length, 'room', 'rooms') + '. ', school.has('room') ? 'Tap a room for its page.' : 'The rooms are listed below.'];
    return pageOf(['Building map: ', typed(floor.name)], lede, besideMap([], h('div', { class: 'part' }, map, key), [list, rest]));
  },
};
return { roomsInOrder, floorLegend, mapView };
})();

const { staffingRows, staffingView } = (() => {
// #/staffing  Staffing
//
// For every subject the school has defined, with or without a teacher: how
// many teachers it has and how many periods they teach on each day type.






// One row a subject, in the school's own order, then a row for teachers with
// no subject when there are any:
// [{ subject, teachers, taught: [periods taught on each own day type] }]
// A taught period is one period of one teacher's day with a group in it, by
// the engine's rule for a teacher's day.
function staffingRows(school) {
  const dayTypes = school.ownDayTypes();
  const rowFor = (subject, teachers) => ({
    subject,
    teachers,
    taught: dayTypes.map((dayType) => {
      const days = everyTeacherDay(school, dayType.id);
      return teachers.reduce((sum, teacher) => sum + days.get(teacher.id).filter((entry) => entry.kind === 'teaching').length, 0);
    }),
  });
  const rows = school.subjects.map((subject) => rowFor(subject, school.teachers.filter((teacher) => teacher.subjectId === subject.id)));
  const loose = school.teachers.filter((teacher) => !school.subject(teacher.subjectId));
  if (loose.length > 0) rows.push(rowFor(null, loose));
  return rows;
}

const staffingView = {
  id: 'staffing',
  flag: 'staffing',
  nav: 'search',
  title() {
    return 'Staffing';
  },
  render(ctx) {
    const school = ctx.school;
    const dayTypes = school.ownDayTypes();
    const followers = school.dayTypes.filter((dayType) => !school.isOwnCopy(dayType.id));
    const rows = staffingRows(school);
    const total = dayTypes.map((dayType, at) => rows.reduce((sum, row) => sum + row.taught[at], 0));

    const table = h('div', { class: 'scroll', role: 'region', tabindex: '0', 'aria-label': 'Teachers and taught periods by subject' },
      h('table', { class: 'table table--figures' },
        h('thead', null, h('tr', null,
          h('th', { scope: 'col' }, 'Subject'),
          h('th', { scope: 'col' }, 'Teachers'),
          dayTypes.map((dayType) => h('th', { scope: 'col' }, 'Taught periods on ', typed(dayType.name))))),
        h('tbody', null, rows.map((row) => h('tr', { dataset: { subject: row.subject ? row.subject.id : '' } },
          h('th', { scope: 'row' },
            subjectChipOf(row.subject),
            row.teachers.length > 0 ? h('span', { class: 'table__under' }, wordsJoined(row.teachers.map((teacher) => linkToTeacher(school, teacher)))) : null),
          h('td', null, String(row.teachers.length)),
          row.taught.map((n) => h('td', null, String(n)))))),
        h('tfoot', null, h('tr', null,
          h('th', { scope: 'row' }, 'All subjects'),
          h('td', null, String(school.teachers.length)),
          total.map((n) => h('td', null, String(n)))))));

    const lede = countOf(school.teachers.length, 'teacher', 'teachers') + ' in ' + countOf(school.subjects.length, 'subject', 'subjects') + '.';
    return pageOf('Staffing', lede,
      table,
      followers.length > 0 ? h('p', { class: 'muted' }, wordsJoined(followers.map((dayType) => typed(dayType.name))), followers.length === 1 ? ' is' : ' are', ' the same as ', typed(school.dayTypes[0].name), '.') : null);
  },
};
return { staffingRows, staffingView };
