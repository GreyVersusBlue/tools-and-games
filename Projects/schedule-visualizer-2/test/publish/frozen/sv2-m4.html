// ---- staff/views/free.js
const { freeTeachers, emptyRooms, freeView } = (() => {
// #/free  Free right now
//
// Which teachers have no group, and which rooms are empty, in one period: the
// period it is by the reader's clock and the school's bells, or one chosen.
// While it shows "now" the page reads the clock again as time passes and is
// drawn again when the period changes. A period chosen by hand is kept in the
// address (?p=2&d=…), so the page can be shared and Back returns to it.
//
// A teacher is free when engine/teacher-day.js says the period is planning; a
// room is empty when no group's day puts a group in it. Rooms can be narrowed
// by seats, subject and wing (?seats=40&subject=…&wing=…).






// The teachers with no group in a period, in the school's own order.
function freeTeachers(school, dayTypeId, period) {
  const days = everyTeacherDay(school, dayTypeId);
  return school.teachers.filter((teacher) => {
    const entry = days.get(teacher.id)[period];
    return Boolean(entry) && entry.kind === 'planning';
  });
}

// The rooms no group is in during a period, in the building's own order.
function emptyRooms(school, dayTypeId, period) {
  const used = new Set();
  for (const group of school.groups) {
    const slot = school.groupDay(group.id, dayTypeId)[period];
    if (slot && slot.room) used.add(slot.room);
  }
  return school.rooms.filter((room) => !used.has(room.id));
}

function countOf(n, one, many) {
  return n + ' ' + (n === 1 ? one : many);
}

function roomDetail(school, room) {
  const pieces = [];
  const add = (piece) => {
    if (pieces.length > 0) pieces.push(' · ');
    pieces.push(piece);
  };
  const floor = school.floorOfRoom(room.id);
  if (floor) add(typed(floor.name));
  if (typeof room.capacity === 'number') add(countOf(room.capacity, 'seat', 'seats'));
  const subject = school.subject(room.subjectId);
  if (subject) add(typed(subject.name));
  if (room.wing) add(typed(room.wing));
  return pieces;
}

const freeView = {
  id: 'free',
  flag: 'free',
  nav: 'now',
  title(ctx, route) {
    return 'Free right now';
  },
  render(ctx, route) {
    const school = ctx.school;
    const state = {
      dayType: dayTypeFor(ctx, route),
      period: periodFor(school, route),
      seats: /^\d+$/.test(route.query.seats || '') ? Number(route.query.seats) : 0,
      subject: school.subject(route.query.subject) ? route.query.subject : '',
      wing: route.query.wing || '',
    };
    let lastKey = '';

    const says = h('p', { class: 'lede', role: 'status' });
    const pickers = h('div', { class: 'controls' });
    const teachersOut = h('section', { 'aria-label': 'Teachers free' });
    const roomsOut = h('section', { class: 'stack', 'aria-label': 'Rooms empty' });
    const roomList = h('div', { dataset: { out: 'rooms' } });

    const shownPeriod = (moment) => (state.period === '' ? moment.shown : state.period);

    const address = () => {
      const chosen = state.period !== '';
      ctx.replace(makeHash('free', '', {
        p: chosen ? String(state.period) : '',
        d: chosen ? state.dayType.id : '',
        seats: state.seats > 0 ? state.seats : '',
        subject: state.subject,
        wing: state.wing,
      }));
    };

    const drawRooms = (period) => {
      const empty = emptyRooms(school, state.dayType.id, period);
      const unknown = state.seats > 0 ? empty.filter((room) => typeof room.capacity !== 'number').length : 0;
      const shown = empty.filter((room) => (state.seats === 0 || (typeof room.capacity === 'number' && room.capacity >= state.seats))
        && (state.subject === '' || room.subjectId === state.subject)
        && (state.wing === '' || room.wing === state.wing));
      const narrowed = state.seats > 0 || state.subject !== '' || state.wing !== '';
      roomList.replaceChildren(...[
        sectionHeading(narrowed ? 'Rooms empty that match' : 'Rooms empty', shown.length),
        shown.length === 0
          ? h('p', { class: 'muted' }, narrowed ? 'No empty room matches. Ask for less above.' : 'Every room has a group in it.')
          : h('ul', { class: 'list', dataset: { list: 'rooms' } }, shown.map((room) => h('li', null,
            viewLink(school, 'room', room.id, [
              h('span', { class: 'list__name' }, typed(school.roomName(room, true))),
              h('span', { class: 'list__detail' }, roomDetail(school, room)),
            ], 'list__link')))),
        unknown > 0 ? h('p', { class: 'muted' }, countOf(unknown, 'empty room has', 'empty rooms have') + ' no number of seats in this schedule and ' + (unknown === 1 ? 'is' : 'are') + ' left out.') : null,
      ].filter(Boolean));
      return empty.length;
    };

    const draw = () => {
      const moment = momentOf(school, state.dayType.id, clockNow(ctx));
      lastKey = momentKey(state.dayType.id, moment);
      const period = shownPeriod(moment);
      const times = periodTimes(school, state.dayType.id, period);
      const free = freeTeachers(school, state.dayType.id, period);

      teachersOut.replaceChildren(
        sectionHeading('Teachers free', free.length),
        free.length === 0
          ? h('p', { class: 'muted' }, 'Every teacher has a group.')
          : h('ul', { class: 'list', dataset: { list: 'teachers' } }, free.map((teacher) => h('li', null,
            viewLink(school, 'teacher', teacher.id, [
              h('span', { class: 'list__name' }, typed(teacher.name)),
              h('span', { class: 'list__detail' }, teacherDetail(school, teacher)),
            ], 'list__link')))));
      const rooms = drawRooms(period);

      const counts = countOf(free.length, 'teacher', 'teachers') + ' and ' + countOf(rooms, 'room', 'rooms') + ' are free.';
      const named = [school.periodName(period), times ? ', ' + times : ''];
      let sentence;
      if (state.period !== '') sentence = [named, ' on ', typed(state.dayType.name), ': ', counts];
      else if (moment.state === 'in') sentence = [momentWords(school, state.dayType, moment), ' ', counts];
      else sentence = [momentWords(school, state.dayType, moment), ' Showing ', named, ': ', counts];
      says.replaceChildren(h('span', null, sentence));
      says.dataset.period = String(period);
      says.dataset.moment = state.period === '' ? moment.state : 'chosen';
    };

    // The pickers are made again only when the day type changes (the periods'
    // times are the day type's), so choosing a period never moves focus.
    const drawPickers = (focus) => {
      pickers.replaceChildren(...[
        dayTypePicker(ctx, state.dayType.id, (dayType) => {
          state.dayType = dayType;
          address();
          drawPickers(true);
          draw();
        }),
        periodPicker(school, state.dayType.id, state.period, (value) => {
          state.period = value;
          address();
          draw();
        }),
      ].filter(Boolean));
      const checked = focus ? pickers.querySelector('input:checked') : null;
      if (checked) checked.focus();
    };

    // The room filters are made once, so a field keeps its focus while typing.
    const subjects = school.subjects.filter((subject) => school.rooms.some((room) => room.subjectId === subject.id));
    const wings = Array.from(new Set(school.rooms.map((room) => room.wing).filter(Boolean)));
    const seats = h('input', { class: 'field__input', id: 'free-seats', type: 'number', inputmode: 'numeric', min: '1', max: '999', step: '1', value: state.seats > 0 ? String(state.seats) : null });
    const subject = h('select', { class: 'field__input', id: 'free-subject' },
      h('option', { value: '' }, 'Any subject'),
      subjects.map((item) => h('option', { value: item.id, selected: item.id === state.subject }, item.name)));
    const wing = h('select', { class: 'field__input', id: 'free-wing' },
      h('option', { value: '' }, 'Any wing'),
      wings.map((name) => h('option', { value: name, selected: name === state.wing }, name)));
    const again = () => {
      state.seats = /^\d+$/.test(seats.value) ? Number(seats.value) : 0;
      state.subject = subject.value;
      state.wing = wing.value;
      address();
      drawRooms(shownPeriod(momentOf(school, state.dayType.id, clockNow(ctx))));
    };
    seats.addEventListener('input', again);
    subject.addEventListener('change', again);
    wing.addEventListener('change', again);
    roomsOut.replaceChildren(
      h('div', { class: 'controls controls--row' },
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'free-seats' }, 'Seats, at least'), seats),
        subjects.length > 0 ? h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'free-subject' }, 'Subject'), subject) : null,
        wings.length > 0 ? h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'free-wing' }, 'Wing'), wing) : null),
      roomList);

    drawPickers(false);
    draw();
    const page = pageOf('Free right now', null, says, nowTabs(school, 'free'), pickers, teachersOut, roomsOut);
    watchClock(page, () => {
      if (state.period !== '') return;
      if (momentKey(state.dayType.id, momentOf(school, state.dayType.id, clockNow(ctx))) !== lastKey) draw();
    });
    return page;
  },
};
return { freeTeachers, emptyRooms, freeView };
})();
// ---- staff/views/now.js
const { nowView } = (() => {
// #/now  Where right now
//
// Pick a group: the room it is in this period, and the teacher. Pick a
// teacher: the group and the room, or that the period is planning. The period
// is the one it is by the reader's clock and the school's bells, read again as
// time passes, or one chosen. The choice is kept in the address
// (?g=… or ?t=…, and ?p=2&d=… for a chosen period).







// The teachers who have a group in a period, by the engine's rule.
function teachersOf(school, groupId, dayTypeId, period) {
  const days = everyTeacherDay(school, dayTypeId);
  return school.teachers.filter((teacher) => {
    const entry = days.get(teacher.id)[period];
    return Boolean(entry) && entry.groups.some((taught) => taught.groupId === groupId);
  });
}

function names(school, view, items, nameOf) {
  const pieces = [];
  items.forEach((item, index) => {
    if (index > 0) pieces.push(index === items.length - 1 ? ' and ' : ', ');
    pieces.push(viewLink(school, view, item.id, typed(nameOf(item))));
  });
  return pieces;
}

// Where a room is: in words, with the way to its floor on the map, and then
// the room and what is near it as a picture.
function whereRoom(ctx, room) {
  const school = ctx.school;
  const floor = school.floorOfRoom(room.id);
  if (!floor) return null;
  const near = aroundRoom(ctx, room);
  return [
    h('p', { dataset: { where: 'floor' } },
      typed(school.roomName(room, true)), ' is on ', typed(floor.name), room.wing ? [', ', typed(room.wing)] : null, '. ',
      school.has('map') ? h('a', { href: makeHash('map', floor.id) }, 'Show ', typed(floor.name), ' on the map') : null),
    near ? h('div', { dataset: { where: 'map' } }, near) : null,
  ];
}

const nowView = {
  id: 'now',
  flag: 'now',
  nav: 'now',
  title(ctx, route) {
    return 'Where right now';
  },
  render(ctx, route) {
    const school = ctx.school;
    const state = {
      dayType: dayTypeFor(ctx, route),
      period: periodFor(school, route),
      group: school.group(route.query.g) ? route.query.g : '',
      teacher: !school.group(route.query.g) && school.teacher(route.query.t) ? route.query.t : '',
    };
    let lastKey = '';

    const says = h('p', { class: 'lede', role: 'status' });
    const pickers = h('div', { class: 'controls' });
    const out = h('div', { class: 'card', dataset: { out: 'where' } });

    const address = () => {
      const chosen = state.period !== '';
      ctx.replace(makeHash('now', '', {
        g: state.group,
        t: state.teacher,
        p: chosen ? String(state.period) : '',
        d: chosen ? state.dayType.id : '',
      }));
    };

    const groupCard = (period, when) => {
      const group = school.group(state.group);
      const slot = school.groupDay(group.id, state.dayType.id)[period];
      const room = slot && slot.room ? school.room(slot.room) : null;
      const who = teachersOf(school, group.id, state.dayType.id, period);
      const name = viewLink(school, 'group', group.id, typed(group.name));
      let sentence;
      if (room) sentence = [name, ' is in ', viewLink(school, 'room', room.id, typed(school.roomName(room))), who.length > 0 ? [' with ', names(school, 'teacher', who, (teacher) => teacher.name)] : null, when, '.'];
      else if (slot && slot.roomText) sentence = [name, ' is in ', typed(slot.roomText), ', which is not in the building', when, '.'];
      else sentence = [name, ' has no room', when, '.'];
      return [
        h('p', { class: 'card__title', dataset: { where: 'sentence' } }, sentence),
        slot && slot.label ? h('p', { class: 'muted' }, typed(slot.label)) : null,
        room ? whereRoom(ctx, room) : null,
      ];
    };

    const teacherCard = (period, when) => {
      const teacher = school.teacher(state.teacher);
      const entry = everyTeacherDay(school, state.dayType.id).get(teacher.id)[period];
      const name = viewLink(school, 'teacher', teacher.id, typed(teacher.name));
      const based = (teacher.roomIds || []).map((id) => school.room(id)).filter(Boolean);
      if (entry && entry.kind === 'teaching') {
        const rooms = entry.groups.map((taught) => taught.roomId).filter((id, index, all) => id !== null && all.indexOf(id) === index).map((id) => school.room(id));
        return [
          h('p', { class: 'card__title', dataset: { where: 'sentence' } }, name, ' has ', entryWords(school, entry), when, '.'),
          rooms.map((room) => whereRoom(ctx, room)),
        ];
      }
      return [
        h('p', { class: 'card__title', dataset: { where: 'sentence' } }, name, ' has no group', when, ': it is planning.'),
        based.length > 0 ? h('p', null, 'Based in ', names(school, 'room', based, (room) => school.roomName(room)), '.') : null,
        based.map((room) => whereRoom(ctx, room)),
      ];
    };

    const gate = printGate();
    const draw = () => {
      gate.set(Boolean(state.group || state.teacher));
      const moment = momentOf(school, state.dayType.id, clockNow(ctx));
      lastKey = momentKey(state.dayType.id, moment);
      const period = state.period === '' ? moment.shown : state.period;
      const times = periodTimes(school, state.dayType.id, period);
      const named = [school.periodName(period), times ? ', ' + times : ''];
      const live = state.period === '' && moment.state === 'in';
      // "right now" is said only when it is: otherwise the period is named
      const when = live ? ' right now' : [' in ', school.periodName(period)];

      let sentence;
      if (state.period !== '') sentence = [named, ' on ', typed(state.dayType.name), '.'];
      else if (moment.state === 'in') sentence = momentWords(school, state.dayType, moment);
      else sentence = [momentWords(school, state.dayType, moment), ' Showing ', named, '.'];
      says.replaceChildren(h('span', null, sentence));
      says.dataset.period = String(period);
      says.dataset.moment = state.period === '' ? moment.state : 'chosen';

      let body;
      if (state.group) body = groupCard(period, when);
      else if (state.teacher) body = teacherCard(period, when);
      else body = [h('p', { class: 'muted' }, 'Choose a group or a teacher above.')];
      out.replaceChildren(...body.flat(Infinity).filter(Boolean));
    };

    const who = h('select', { class: 'field__input', id: 'now-who' },
      h('option', { value: '' }, 'Choose…'),
      school.groups.length > 0 ? h('optgroup', { label: 'Groups' }, school.groups.map((group) => h('option', { value: 'g:' + group.id, selected: group.id === state.group }, group.name))) : null,
      school.teachers.length > 0 ? h('optgroup', { label: 'Teachers' }, school.teachers.map((teacher) => h('option', { value: 't:' + teacher.id, selected: teacher.id === state.teacher }, teacher.name))) : null);
    who.addEventListener('change', () => {
      state.group = who.value.startsWith('g:') ? who.value.slice(2) : '';
      state.teacher = who.value.startsWith('t:') ? who.value.slice(2) : '';
      address();
      draw();
    });

    const drawPickers = (focus) => {
      pickers.replaceChildren(...[
        dayTypePicker(ctx, state.dayType.id, (dayType) => {
          state.dayType = dayType;
          address();
          drawPickers(true);
          draw();
        }),
        periodPicker(school, state.dayType.id, state.period, (value) => {
          state.period = value;
          address();
          draw();
        }),
      ].filter(Boolean));
      const checked = focus ? pickers.querySelector('input:checked') : null;
      if (checked) checked.focus();
    };

    drawPickers(false);
    draw();
    const page = gate.on(pageOf('Where right now', null, says, nowTabs(school, 'now'),
      h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'now-who' }, 'Group or teacher'), who),
      out, pickers));
    watchClock(page, () => {
      if (state.period !== '') return;
      if (momentKey(state.dayType.id, momentOf(school, state.dayType.id, clockNow(ctx))) !== lastKey) draw();
    });
    return page;
  },
};
return { nowView };
})();
// ---- staff/views/common.js
const { commonPeriods, commonView } = (() => {
// #/common?t=…,…  Common planning
//
// Pick two or more teachers: the periods when every one of them is free, for
// each day type, with the full grid beneath. Day types that give the same
// answer at the same times share one card. The teachers picked are kept in the
// address, so the page can be shared and bookmarked.







function chosenFrom(school, text) {
  const ids = [];
  for (const id of String(text || '').split(',')) {
    if (id !== '' && school.teacher(id) && !ids.includes(id)) ids.push(id);
  }
  return ids;
}

// The periods in which every one of the teachers is free, on one day type.
function commonPeriods(school, teacherIds, dayTypeId) {
  const days = everyTeacherDay(school, dayTypeId);
  const periods = [];
  for (let period = 0; period < school.data.settings.periods; period += 1) {
    if (teacherIds.every((id) => days.get(id)[period].kind === 'planning')) periods.push(period);
  }
  return periods;
}

function listOf(words) {
  const pieces = [];
  words.forEach((word, index) => {
    if (index > 0) pieces.push(index === words.length - 1 ? ' and ' : ', ');
    pieces.push(word);
  });
  return pieces;
}

const commonView = {
  id: 'common',
  flag: 'common',
  nav: 'search',
  title(ctx, route) {
    return 'Common planning';
  },
  render(ctx, route) {
    const school = ctx.school;
    let chosen = chosenFrom(school, route.query.t);

    const says = h('p', { class: 'lede', role: 'status' });
    const picked = h('ul', { class: 'chips', 'aria-label': 'Teachers chosen' });
    const adder = h('select', { class: 'field__input', id: 'common-add' });
    const out = h('div', { class: 'stack', dataset: { out: 'common' } });

    const dayCard = (set) => {
      const dayTypeId = set.first.id;
      const days = everyTeacherDay(school, dayTypeId);
      const together = commonPeriods(school, chosen, dayTypeId);
      const everyone = chosen.length === 2 ? 'Both are' : 'All ' + chosen.length + ' are';
      const rows = [];
      for (let period = 0; period < school.data.settings.periods; period += 1) {
        const all = together.includes(period);
        const times = periodTimes(school, dayTypeId, period);
        rows.push(h('tr', { class: all ? 'table__row--all' : null, dataset: { period: String(period), all: all ? 'true' : null } },
          h('th', { scope: 'row' }, school.periodName(period), times ? h('span', { class: 'table__sub' }, times) : null),
          chosen.map((id) => {
            const entry = days.get(id)[period];
            return h('td', null, entry.kind === 'planning' ? 'Free' : entryWords(school, entry));
          }),
          h('td', null, all ? h('strong', null, 'All free') : null)));
      }
      return h('section', { class: 'card', dataset: { days: set.dayTypes.map((dayType) => dayType.id).join(' ') } },
        h('h2', { class: 'card__title' }, dayTypeNames(set.dayTypes)),
        h('p', { dataset: { common: 'sentence' } }, together.length === 0
          ? 'There is no ' + school.data.settings.periodWord.toLowerCase() + ' when ' + (chosen.length === 2 ? 'both' : 'all ' + chosen.length) + ' are free.'
          : [everyone, ' free in ', listOf(together.map((period) => school.periodName(period))), '.']),
        h('div', { class: 'scroll', role: 'region', tabindex: '0', 'aria-label': 'The full grid for ' + set.dayTypes.map((dayType) => dayType.name).join(', ') },
          h('table', { class: 'table' },
            h('thead', null, h('tr', null,
              h('th', { scope: 'col' }, school.data.settings.periodWord),
              chosen.map((id) => h('th', { scope: 'col' }, viewLink(school, 'teacher', id, typed(school.teacher(id).name)))),
              h('th', { scope: 'col' }, 'Together'))),
            h('tbody', null, rows))));
    };

    const gate = printGate();
    const draw = () => {
      gate.set(chosen.length >= 2);
      picked.replaceChildren(...chosen.map((id) => {
        const teacher = school.teacher(id);
        return h('li', { class: 'chips__item' },
          h('span', null, typed(teacher.name)),
          h('button', { class: 'chips__remove', type: 'button', 'aria-label': 'Remove ' + teacher.name, dataset: { remove: id }, onclick: () => {
            chosen = chosen.filter((other) => other !== id);
            ctx.replace(makeHash('common', '', { t: chosen.join(',') }));
            draw();
            adder.focus();
          } }, 'Remove'));
      }));
      picked.hidden = chosen.length === 0;
      const rest = school.teachers.filter((teacher) => !chosen.includes(teacher.id));
      adder.replaceChildren(
        h('option', { value: '' }, rest.length === 0 ? 'Every teacher is chosen' : 'Choose a teacher…'),
        ...rest.map((teacher) => h('option', { value: teacher.id }, teacher.name)));
      adder.disabled = rest.length === 0;

      if (chosen.length < 2) {
        says.replaceChildren(h('span', null, chosen.length === 0 ? 'Choose two or more teachers to see when all of them are free.' : 'Choose one more teacher to see when both are free.'));
        out.replaceChildren();
        return;
      }
      const sets = dayKindsOf(school, (dayType) => chosen.map((id) => everyTeacherDay(school, dayType.id).get(id)));
      const found = sets.map((set) => ({ set, periods: commonPeriods(school, chosen, set.first.id) })).filter((part) => part.periods.length > 0);
      says.replaceChildren(h('span', null, found.length === 0
        ? (chosen.length === 2 ? 'These two teachers are' : 'These ' + chosen.length + ' teachers are') + ' never all free in the same ' + school.data.settings.periodWord.toLowerCase() + '.'
        : [chosen.length === 2 ? 'Both are' : 'All ' + chosen.length + ' are', ' free in ', found.map((part, index) => [
          index > 0 ? '; in ' : null,
          listOf(part.periods.map((period) => school.periodName(period))),
          ' on ',
          dayTypeNames(part.set.dayTypes),
        ]), '.']));
      out.replaceChildren(...sets.map(dayCard));
    };

    adder.addEventListener('change', () => {
      if (adder.value === '' || !school.teacher(adder.value)) return;
      chosen = chosen.concat(adder.value);
      ctx.replace(makeHash('common', '', { t: chosen.join(',') }));
      draw();
    });

    draw();
    return gate.on(pageOf('Common planning', null, says,
      h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'common-add' }, 'Add a teacher'), adder),
      picked, out));
  },
};
return { commonPeriods, commonView };
})();
// ---- staff/views/coverage.js
const { coverageFor, teacherChooser, coverageView } = (() => {
// #/coverage/t…  Coverage
//
// A teacher is out: for each period they teach on the chosen day type, the
// teachers who are free then, those of the same subject first, each with
// their rooms. With no teacher in the address the page asks for one.
//
// Marking who will cover, and sending the marked plan back as a link, are not
// built (a wish in the specification).







// For each period a teacher teaches on a day type, who is free to cover it:
//
//   [{ period, entry, candidates: [{ teacher, sameSubject }] }]
//
// Same-subject teachers come first; within each part the order is the
// school's own. A teacher with no subject is the same subject as nobody.
function coverageFor(school, teacherId, dayTypeId) {
  const absent = school.teacher(teacherId);
  const day = everyTeacherDay(school, dayTypeId).get(teacherId) || [];
  const periods = [];
  for (const entry of day) {
    if (entry.kind !== 'teaching') continue;
    const free = freeTeachers(school, dayTypeId, entry.period).filter((teacher) => teacher.id !== teacherId);
    const same = (teacher) => Boolean(absent.subjectId) && teacher.subjectId === absent.subjectId;
    periods.push({
      period: entry.period,
      entry,
      candidates: free.filter(same).map((teacher) => ({ teacher, sameSubject: true })).concat(free.filter((teacher) => !same(teacher)).map((teacher) => ({ teacher, sameSubject: false }))),
    });
  }
  return periods;
}

// The page that asks which teacher, for Coverage and for the substitute plan.
function teacherChooser(ctx, view, title, lede) {
  const school = ctx.school;
  const select = h('select', { class: 'field__input', id: view + '-teacher' },
    h('option', { value: '' }, 'Choose a teacher…'),
    school.teachers.map((teacher) => h('option', { value: teacher.id }, teacher.name)));
  select.addEventListener('change', () => {
    if (select.value !== '') ctx.go(makeHash(view, select.value));
  });
  return printWhen(pageOf(title, lede,
    school.teachers.length === 0
      ? h('p', { class: 'muted' }, 'This schedule has no teachers.')
      : h('div', { class: 'field' }, h('label', { class: 'field__label', for: view + '-teacher' }, 'Teacher who is out'), select)), false);
}

function listOf(words) {
  const pieces = [];
  words.forEach((word, index) => {
    if (index > 0) pieces.push(index === words.length - 1 ? ' and ' : ', ');
    pieces.push(word);
  });
  return pieces;
}

const coverageView = {
  id: 'coverage',
  flag: 'coverage',
  nav: 'search',
  title(ctx, route) {
    const found = ctx.school.teacher(route.id);
    return found ? 'Coverage: ' + found.name : 'Coverage';
  },
  render(ctx, route) {
    const school = ctx.school;
    const absent = route.id ? school.teacher(route.id) : null;
    if (route.id && !absent) return missingPage('teacher');
    if (!absent) return teacherChooser(ctx, 'coverage', 'Coverage', 'Who is free to cover each period of a teacher who is out.');

    let dayType = dayTypeFor(ctx, route);
    const says = h('p', { class: 'lede', role: 'status' });
    const picker = h('div', { class: 'controls' });
    const out = h('div', { class: 'stack', dataset: { out: 'coverage' } });
    const links = h('p', { class: 'actions' });
    const word = school.data.settings.periodWord.toLowerCase();

    const draw = () => {
      const periods = coverageFor(school, absent.id, dayType.id);
      const nobody = periods.filter((item) => item.candidates.length === 0);
      const name = typed(absent.name);
      let sentence;
      if (periods.length === 0) sentence = [name, ' teaches no group on ', typed(dayType.name), ', so there is nothing to cover.'];
      else {
        sentence = [name, ' teaches ', String(periods.length), ' of ', String(school.data.settings.periods), ' ', word, 's on ', typed(dayType.name), '. ',
          nobody.length === 0 ? 'Somebody is free in every one of them.' : ['Nobody is free in ', listOf(nobody.map((item) => school.periodName(item.period))), '.']];
      }
      says.replaceChildren(h('span', null, sentence));

      out.replaceChildren(...periods.map((item) => {
        const times = periodTimes(school, dayType.id, item.period);
        return h('section', { class: 'card', dataset: { period: String(item.period) } },
          h('h2', { class: 'card__title' }, school.periodName(item.period), times ? h('span', { class: 'card__when' }, times) : null),
          h('p', null, entryWords(school, item.entry)),
          sectionHeading('Free to cover', item.candidates.length),
          item.candidates.length === 0
            ? h('p', { class: 'muted' }, 'Nobody is free this ' + word + '.')
            : h('ul', { class: 'list', dataset: { list: 'candidates' } }, item.candidates.map((candidate) => h('li', { dataset: { same: candidate.sameSubject ? 'true' : 'false' } },
              viewLink(school, 'teacher', candidate.teacher.id, [
                h('span', { class: 'list__name' }, typed(candidate.teacher.name), candidate.sameSubject ? h('span', { class: 'tag' }, 'Same subject') : null),
                h('span', { class: 'list__detail' }, teacherDetail(school, candidate.teacher)),
              ], 'list__link')))));
      }));

      links.replaceChildren(...[
        school.has('sub') ? h('a', { class: 'btn', href: makeHash('sub', absent.id, { d: dayType.id }) }, 'Substitute plan') : null,
        school.has('teacher') ? h('a', { class: 'btn', href: makeHash('teacher', absent.id) }, 'The teacher\'s page') : null,
      ].filter(Boolean));
    };

    const chosen = dayTypePicker(ctx, dayType.id, (next) => {
      dayType = next;
      ctx.replace(makeHash('coverage', absent.id, { d: route.query.d ? dayType.id : '' }));
      draw();
    });
    if (chosen) picker.appendChild(chosen);
    draw();
    return pageOf(['Coverage: ', typed(absent.name)], null, says, picker, out, links);
  },
};
return { coverageFor, teacherChooser, coverageView };
})();
// ---- staff/views/sub.js
const { SUB_CANDIDATES, SUB_CHECK_SENTENCE, subDateWords, subView } = (() => {
// #/sub/t…  Substitute plan
//
// One page to print for a substitute: the absent teacher's day with rooms,
// groups and times, a date line, who could cover each period, where the room
// is, the teacher's notes, and a line saying to check it against the office.
// The page is a single column so it prints as it reads; the pickers and
// buttons are left off the paper. On paper the date is a line of words, not
// the field it was chosen in, and every teacher who could cover a period is
// named: the screen's "and 2 more" leads to a list a sheet of paper cannot
// follow.









const SUB_CANDIDATES = 3;
const SUB_CHECK_SENTENCE = 'Check this plan with the office before the day starts.';

// The reader's own day, as a date field wants it: "2026-09-01".
function localDay(date) {
  const two = (n) => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + two(date.getMonth() + 1) + '-' + two(date.getDate());
}

// "Tuesday, 1 September 2026" from a date field's "2026-09-01", in the
// reader's own language; a blank line to write on when the field is empty.
function subDateWords(value) {
  const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
  if (!parts) return '________________';
  return new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])));
}

const subView = {
  id: 'sub',
  flag: 'sub',
  nav: 'search',
  title(ctx, route) {
    const found = ctx.school.teacher(route.id);
    return found ? 'Substitute plan: ' + found.name : 'Substitute plan';
  },
  render(ctx, route) {
    const school = ctx.school;
    const absent = route.id ? school.teacher(route.id) : null;
    if (route.id && !absent) return missingPage('teacher');
    if (!absent) return teacherChooser(ctx, 'sub', 'Substitute plan', 'One page to print for a substitute.');

    let dayType = dayTypeFor(ctx, route);
    const now = clockNow(ctx);
    const says = h('p', { class: 'lede' });
    const out = h('div', { class: 'stack', dataset: { out: 'sub' } });
    const based = (absent.roomIds || []).map((id) => school.room(id)).filter(Boolean);

    const date = h('input', { class: 'field__input', id: 'sub-date', type: 'date', value: /^\d{4}-\d{2}-\d{2}$/.test(route.query.date || '') ? route.query.date : localDay(now) });
    const dated = h('p', { class: 'print-only sub__date', dataset: { sub: 'date' } }, 'Date: ', subDateWords(date.value));
    const address = () => ctx.replace(makeHash('sub', absent.id, { d: route.query.d ? dayType.id : '', date: date.value !== localDay(now) ? date.value : '' }));
    date.addEventListener('change', () => {
      dated.replaceChildren('Date: ', subDateWords(date.value));
      address();
    });

    const draw = () => {
      const day = everyTeacherDay(school, dayType.id).get(absent.id);
      const cover = coverageFor(school, absent.id, dayType.id);
      const taught = cover.length;
      says.replaceChildren(typed(absent.name), '\'s day on ', typed(dayType.name), ': ',
        taught === 0 ? 'no group to teach.' : taught + ' of ' + day.length + ' ' + school.data.settings.periodWord.toLowerCase() + 's with a group.');

      out.replaceChildren(...[
        h('section', { class: 'card', dataset: { sub: 'day' } },
          h('h2', { class: 'card__title' }, 'The day: ', typed(dayType.name)),
          h('p', { class: 'muted' }, teacherDetail(school, absent)),
          h('div', { class: 'rows' }, day.map((entry) => h('div', { class: 'row row--plan', dataset: { period: String(entry.period) } },
            h('span', { class: 'row__when' }, school.periodName(entry.period), h('br'), periodTimes(school, dayType.id, entry.period)),
            h('span', { class: entry.kind === 'teaching' ? 'row__what' : 'row__what muted' }, entryWords(school, entry)))))),

        h('section', { class: 'card', dataset: { sub: 'cover' } },
          sectionHeading('Who could cover'),
          taught === 0
            ? h('p', { class: 'muted' }, 'Nothing needs covering.')
            : h('ul', { class: 'plain' }, cover.map((item) => h('li', { dataset: { period: String(item.period) } },
              h('strong', null, school.periodName(item.period), ': '),
              // the first few on screen, with a count of the rest; on paper, every one
              item.candidates.length === 0 ? 'nobody is free.' : item.candidates.map((candidate, index) => h('span', { class: index < SUB_CANDIDATES ? null : 'sub__rest', dataset: { candidate: candidate.teacher.id } },
                index > 0 ? ', ' : null,
                viewLink(school, 'teacher', candidate.teacher.id, typed(candidate.teacher.name)),
                candidate.sameSubject ? ' (same subject)' : null)),
              item.candidates.length > SUB_CANDIDATES ? h('span', { class: 'no-print', dataset: { sub: 'more' } }, ', and ' + (item.candidates.length - SUB_CANDIDATES) + ' more') : null))),
          school.has('coverage') ? h('p', { class: 'no-print' }, h('a', { href: makeHash('coverage', absent.id, { d: dayType.id }) }, 'Everyone who is free, period by period')) : null),

        h('section', { class: 'card', dataset: { sub: 'room' } },
          sectionHeading(based.length > 1 ? 'Where the rooms are' : 'Where the room is'),
          based.length === 0
            ? h('p', { class: 'muted' }, 'This teacher has no room of their own in this schedule. The day above names the room for each period.')
            : based.map((room) => {
              const floor = school.floorOfRoom(room.id);
              return [h('p', null, viewLink(school, 'room', room.id, typed(school.roomName(room, true))), ' is on ', typed(floor ? floor.name : 'no floor'), room.wing ? [', ', typed(room.wing)] : null, '. ',
                floor && school.has('map') ? h('a', { class: 'no-print', href: makeHash('map', floor.id) }, 'Show ', typed(floor.name), ' on the map') : null),
              aroundRoom(ctx, room)];
            })),

        h('section', { class: 'card', dataset: { sub: 'notes' } },
          sectionHeading('Notes from the teacher'),
          typeof absent.notes === 'string' && absent.notes.trim() !== ''
            ? h('p', { class: 'notes' }, typed(absent.notes))
            : h('p', { class: 'muted' }, 'No notes were left in this schedule.')),

        h('p', { class: 'reminder', dataset: { sub: 'check' } }, h('strong', null, SUB_CHECK_SENTENCE), ' This schedule was published on ' + dayText(school.data.publishedAt, now) + ' and may have changed since.'),
      ]);
    };

    const picker = dayTypePicker(ctx, dayType.id, (next) => {
      dayType = next;
      address();
      draw();
    });
    draw();
    return pageOf(['Substitute plan: ', typed(absent.name)], null, says,
      dated,
      h('div', { class: 'controls' },
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'sub-date' }, 'Date'), date),
        h('div', { class: 'no-print' }, picker)),
      out,
      h('p', { class: 'actions no-print' },
        h('button', { class: 'btn btn--primary', type: 'button', dataset: { sub: 'print', print: 'page' }, onclick: () => globalThis.print() }, 'Print this page')));
  },
};
return { SUB_CANDIDATES, SUB_CHECK_SENTENCE, subDateWords, subView };
})();
// ---- staff/views/directions.js
const { routeFloors, directionsRefusal, directionsView } = (() => {
// #/directions?from=…&to=…  Directions
//
// Pick a start room and an end room: the way between them as numbered steps,
// the floors it passes through, and about how long the walk is. The route and
// its words are the engine's (routing.js and directions.js, through the
// school of model.js), the same ones the planner draws. "Step-free" asks for
// a way with no stairs (?stepfree=1) and says so plainly when there is none;
// the way with stairs is offered only when there is one (directionsRefusal).
//
// The time is the route's own estimate for an empty corridor.







// "under a minute", "about 1 minute", "about 4 minutes".
function about(seconds) {
  if (seconds < 45) return 'under a minute';
  const minutes = Math.max(1, Math.round(seconds / 60));
  return 'about ' + minutes + (minutes === 1 ? ' minute' : ' minutes');
}

function roomPicker(school, id, label, value) {
  const select = h('select', { class: 'field__input', id },
    h('option', { value: '' }, 'Choose a room…'),
    school.floors.map((floor) => {
      const rooms = floor.spaces.filter((space) => space.kind === 'room');
      if (rooms.length === 0) return null;
      const names = h('optgroup', { label: floor.name });
      for (const room of rooms) names.appendChild(h('option', { value: room.id, selected: room.id === value }, school.roomName(room, true)));
      return names;
    }));
  return { select, field: h('div', { class: 'field' }, h('label', { class: 'field__label', for: id }, label), select) };
}

// The floors a route passes through, in the order walked, with the stairs
// between them: [{ floor, cells, stairs }], `stairs` being the letter of the
// stairs taken to leave the floor, or null on the last.
function routeFloors(school, found) {
  const parts = [];
  for (const step of found.cells) {
    const last = parts[parts.length - 1];
    if (last && last.floorId === step.floorId) last.cells += 1;
    else parts.push({ floorId: step.floorId, floor: school.floor(step.floorId), cells: 1, stairs: null });
  }
  // each change of floor is one of the route's connections, taken in order
  const left = (found.connections || []).map((id) => school.data.building.connections.find((item) => item.id === id)).filter(Boolean);
  parts.forEach((part, index) => {
    if (index === parts.length - 1) return;
    const next = parts[index + 1].floorId;
    const at = left.findIndex((item) => (item.a.floorId === part.floorId && item.b.floorId === next) || (item.b.floorId === part.floorId && item.a.floorId === next));
    part.stairs = at === -1 ? '' : left.splice(at, 1)[0].label;
  });
  return parts;
}

// A way that could not be found, for the page: { text, stairs }. `text` is
// the engine's sentence. With step-free asked for, the way is looked for once
// more with stairs allowed: `stairs` is true when that way exists, so the
// page offers it; when there is no way of any kind the sentence is the plain
// refusal's, and nothing is offered that would only lead to another refusal.
// Null when the way was found.
function directionsRefusal(school, fromId, toId, stepFree) {
  const found = school.route(fromId, toId, { avoidStairs: stepFree });
  if (found.ok) return null;
  if (!stepFree) return { text: school.directions(found).text, stairs: false };
  const plain = school.route(fromId, toId, { avoidStairs: false });
  if (plain.ok) return { text: school.directions(found).text, stairs: true };
  return { text: school.directions(plain).text, stairs: false };
}

const directionsView = {
  id: 'directions',
  flag: 'directions',
  nav: 'search',
  title(ctx, route) {
    return 'Directions';
  },
  render(ctx, route) {
    const school = ctx.school;
    const state = {
      from: school.room(route.query.from) ? route.query.from : '',
      to: school.room(route.query.to) ? route.query.to : '',
      stepFree: route.query.stepfree === '1',
    };

    const says = h('p', { class: 'lede', role: 'status' });
    const out = h('div', { class: 'stack', dataset: { out: 'directions' } });
    const from = roomPicker(school, 'directions-from', 'From', state.from);
    const to = roomPicker(school, 'directions-to', 'To', state.to);
    const stepFree = h('input', { class: 'check__input', id: 'directions-stepfree', type: 'checkbox', checked: state.stepFree });
    const gate = printGate();

    const draw = () => {
      gate.set(false);
      if (!state.from || !state.to) {
        says.replaceChildren(h('span', null, 'Choose where you are starting and where you are going.'));
        out.replaceChildren();
        return;
      }
      const found = school.route(state.from, state.to, { avoidStairs: state.stepFree });
      const written = school.directions(found);
      const start = school.room(state.from);
      const end = school.room(state.to);

      // one page failing is said on that page; the rest of the file still works
      page = printWhen(pageOf('This page could not be shown', 'Something in this copy of the schedule could not be read for this page. The other pages still work.',
        h('p', { class: 'muted' }, String(error && error.message ? error.message : error))), false);
    }
    if (unknown) {
      const heading = page.querySelector('.page__title');
      if (heading) heading.before(h('p', { class: 'notice', role: 'status', dataset: { notice: 'unknown' } }, UNKNOWN_PAGE_SENTENCE));
    }
    current.main.replaceChildren(page);
    current.main.dataset.view = view.id;
    // on the frame as well, so a rule for one view's paper (the door sign's)
    // can reach the school's line and the footer without :has()
    root.dataset.view = view.id;
    setTitle(title + ' · ' + current.school.name);
    for (const item of current.bar.querySelectorAll('a[data-item]')) {
      if (item.dataset.item === view.nav) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    }
    if (moveFocus) {
      win.scrollTo(0, 0);
      const heading = current.main.querySelector('h1');
      if (heading) heading.focus({ preventScroll: true });
    }
  }

  function band(kind, text, dismiss) {
    const element = h('p', { class: 'band band--' + kind, dataset: { band: kind } }, h('span', { class: 'band__text' }, text));
    if (dismiss) {
      element.appendChild(h('button', { class: 'band__close', type: 'button', onclick: () => element.remove() }, 'Dismiss'));
    }
    return element;
  }

  function drawBands() {
    if (!open) return;
    const { data, store, bands } = open;
    const list = [];
    const own = dayText(data.publishedAt, now());
    if (isStale(data, now())) list.push(band('stale', 'This copy is from ' + own + ' and may be out of date. Ask the office for a newer one.'));
    const seen = store.get('seen');
    if (isOlderThanSeen(data, seen)) {
      list.push(band('note', 'A newer copy of this schedule has been opened on this device, published ' + dayText(seen, now()) + '. This one is from ' + own + '.'));
    }
    bands.replaceChildren(...list);
    if (open.notKept) bands.appendChild(open.notKept);
  }

  function proceed(data, store, focus) {
    const school = openSchool(data);
    const sameFrame = open !== null && open.data.id === data.id;
    if (sameFrame) {
      // a newer copy of the school already on screen: the preview following the planner
      open.data = data;
      open.school = school;
      open.store = store;
    } else {
      const main = h('main', { class: 'page', id: 'page' });
      const bands = h('div', { class: 'bands', role: 'region', 'aria-label': 'Notices' });
      const bar = h('nav', { class: 'bar', 'aria-label': 'Sections' });
      const top = h('a', { class: 'top__school', href: '#/search' });
      const foot = h('p', null);
      open = { data, school, store, main, bar, bands, top, foot, notKept: open && open.notKept ? open.notKept : null };
      root.dataset.state = 'open';
      root.replaceChildren(h('header', { class: 'top' }, top), bands, main, h('footer', { class: 'foot' }, foot), bar);
    }
    gate = null;
    open.top.replaceChildren(typed(school.name));
    open.foot.replaceChildren(typed(school.name), ' · published ' + momentText(data.publishedAt) + '.');
    open.bar.replaceChildren(...BAR.filter((item) => item.shown(school)).map((item) => h('a', { class: 'bar__item', href: item.hash(school), dataset: { item: item.id } }, icon(item.id), h('span', { class: 'bar__label' }, item.label))));

    drawBands();
    const seen = store.get('seen');
    if (!isOlderThanSeen(data, seen) && seen !== data.publishedAt) store.set('seen', data.publishedAt);

    // A reader who chose themselves opens on their own page. The address is
    // replaced, not added, so Back leaves the file instead of looping.
    if (firstOpen) {
      firstOpen = false;
      const hash = win.location.hash;
      const me = store.get(ME_KEY);
      if ((hash === '' || hash === '#' || hash === '#/') && me && school.teacher(me) && school.has('teacher')) {
        ctxFor(open).replace(makeHash('teacher', me));
      }
    }
    draw(focus);
  }

  // One guard per school for as long as the page is open, so what could only
  // be kept in memory is still there when the preview sends the next copy.
  const stores = new Map();
  let pendingNote = null;

  function storeFor(schoolId) {
    if (!stores.has(schoolId)) {
      stores.set(schoolId, openStorage(schoolId, backend, () => {
        const note = band('note', NOT_KEPT_SENTENCE, true);
        if (open) {
          open.notKept = note;
          open.bands.appendChild(note);
        } else {
          pendingNote = note;
        }
      }));
    }
    return stores.get(schoolId);
  }

  function opened(model, envelope, store, mine, focus) {
    if (mine !== turn) return false;
    const inner = readPublished(model);
    if (inner.kind !== 'open' || inner.model.id !== envelope.schoolId || inner.model.publishedAt !== envelope.publishedAt) {
      refuse('damaged', 'This file cannot be opened', DAMAGED_SENTENCE);
      return false;
    }
    proceed(inner.model, store, focus);
    if (pendingNote && open) {
      open.notKept = pendingNote;
      open.bands.appendChild(pendingNote);
      pendingNote = null;
    }
    return true;
  }

  async function show(value, flags) {
    turn += 1;
    const mine = turn;
    const read = readPublished(value);
    if (read.kind === 'newer') return refuse('newer', 'This schedule needs a newer copy', read.message);
    if (read.kind === 'damaged') return refuse('damaged', 'This file cannot be opened', read.message);
    if (read.kind === 'open') return proceed(read.model, storeFor(read.model.id), false);

    const envelope = read.envelope;
    const store = storeFor(envelope.schoolId);
    // the planner's preview asked for the passcode screen: the key goes from
    // wherever this page kept it, its storage or its memory
    if (flags && flags.forget === true) store.remove('key');
    const kept = store.get('key');
    if (kept) {
      let model = null;
      try {
        model = await unlockWithKey(envelope, fromBase64(kept));
      } catch (error) {
        model = null;
      }
      if (mine !== turn) return undefined;
      if (model !== null) return opened(model, envelope, store, mine, false);
      store.remove('key');
    }
    if (gate && gate.schoolId === envelope.schoolId && root.dataset.state === 'locked') {
      // the unlock screen is already up for this school: keep what was typed
      gate.envelope = envelope;
      return undefined;
    }
    open = null;
    gate = { schoolId: envelope.schoolId, envelope };
    const screen = unlockScreen({
      publishedAt: envelope.publishedAt,
      now: now(),
      unlock: async (passcode) => {
        const target = gate.envelope;
        const result = await unlockPublished(target, passcode);
        if (result === null) return false;
        store.set('key', toBase64(result.key));
        if (gate && gate.envelope !== target) {
          // the preview sent a newer copy while the key was being made
          await show(gate.envelope);
          return true;
        }
        opened(result.model, target, store, turn, true);
        return true;
      },
    });
    // the preview can lock a schedule that is open: the page on screen leaves, and its maps stop listening
    unmountMaps();
    root.dataset.state = 'locked';
    delete root.dataset.view;
    root.replaceChildren(screen.element);
    setTitle('Staff schedule');
    screen.focus();
    return undefined;
  }

  win.addEventListener('hashchange', () => draw(true));
  doc.addEventListener('visibilitychange', () => {
    if (!doc.hidden) drawBands();
  });
  // The bar leaves the screen while a field has focus, so the keyboard does
  // not push it over what is being typed.
  root.addEventListener('focusin', (event) => {
    if (event.target instanceof win.Element && event.target.matches(TYPING)) root.dataset.typing = 'true';
  });
  root.addEventListener('focusout', () => {
    delete root.dataset.typing;
  });

  return {
    show,
    waiting,
    nothing,
    damaged() {
      turn += 1;
      refuse('damaged', 'This file cannot be opened', DAMAGED_SENTENCE);
    },
  };
}
return { mountShell };
})();
// ---- staff/main.js
await (async () => {
// The staff browser's entry. It finds the schedule (inside the page, from the
// planner's preview, or nowhere) and hands it to the shell. As a published
// file this module is the last one in the page's single script; served from
// the tool's folder it is loaded as a module with the others beside it. It is
// the same code both ways.




const root = document.getElementById('app');
const shell = mountShell(root, { win: window, doc: document });

const inline = inlineData(document);
if (inline.found) {
  if (inline.broken) shell.damaged();
  else await shell.show(inline.value);
} else if (isFramed(window)) {
  shell.waiting('Waiting for the planner…');
  watchPreview(window, (data, flags) => {
    shell.show(data, flags);
  });
} else {
  const beside = await siblingData();
  if (beside.found && readPublished(beside.value).kind !== 'damaged') await shell.show(beside.value);
  else shell.nothing();
}
document.documentElement.dataset.ready = 'true';
})();
</script>
