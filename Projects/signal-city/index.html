<body>
<header class="top">
  <a class="home" href="../../index.html" title="Back to the board">◀</a>
  <h1>Signal City <span id="levelName" class="lv"></span></h1>
  <div class="hud">
    <div class="stat"><span class="label">Time</span><b id="clock">3:00</b></div>
    <div class="stat wide"><span class="label">Cleared</span><b id="cleared">0 / 0</b><div class="bar"><i id="throughBar"></i></div></div>
    <div class="stat"><span class="label">Collisions</span><b id="collisions">0</b></div>
    <div class="stat wide"><span class="label">Satisfaction</span><b id="waitNow">&nbsp;</b><div class="bar"><i id="satBar"></i></div></div>
  </div>
</header>

<main class="play">
  <div id="boardWrap" class="board-wrap">
    <canvas id="board" aria-label="The intersection"></canvas>
  </div>
  <aside class="panel">
    <div class="panel-head">
      <span class="label">Signal</span>
      <b id="stage">&nbsp;</b>
    </div>
    <div id="phases" class="phases"></div>
    <button id="priorityBtn" class="priority">Priority corridor <span class="key">E</span></button>
    <p id="hint" class="hint"></p>
    <div class="controls">
      <button id="pauseBtn">Pause</button>
      <button id="speedBtn">1x</button>
      <button id="menuBtn">Levels</button>
    </div>
    <p class="keys">1 to 4 pick a phase · space pauses · F is fast · scroll zooms · click an ambulance</p>
    <div id="saveBar" class="save"></div>
  </aside>
</main>

<div id="selectScrim" class="scrim show">
  <div class="card">
    <h2>Signal City</h2>
    <p class="tagline">You never drive. You only program the lights.</p>
    <div id="levelList" class="levels"></div>
    <p class="foot"><span id="starTotal">0 stars</span> · <a href="sprites.html">the drivers</a></p>
  </div>
</div>

<div id="endScrim" class="scrim">
  <div class="card">
    <h2 id="endTitle">Survived.</h2>
    <div id="endStars" class="stars">☆☆☆</div>
    <div id="endBody"></div>
    <div class="controls">
      <button id="retryBtn">Again</button>
      <button id="levelsBtn">Levels</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
