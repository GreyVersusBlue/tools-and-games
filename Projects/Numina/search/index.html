<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Numina</title>
  <meta name="description" content="Lore, rules, and player guides for the Numina LARP — Numina III, the Age of Works.">
  <link rel="stylesheet" href="/Projects/Numina/css/main.css">
  <link rel="stylesheet" href="/Projects/Numina/css/print.css" media="print">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("numina.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
  <a class="wordmark" href="/Projects/Numina/">Numina</a>
  <nav class="site-nav" aria-label="Site">
    <a href="/Projects/Numina/lore/">Lore</a>
    <a href="/Projects/Numina/mechanics/">Mechanics</a>
  </nav>
  <form class="header-search" action="/Projects/Numina/search/" method="get" role="search">
    <input type="search" name="q" placeholder="Search…" aria-label="Search the site">
  </form>
  <button type="button" class="theme-toggle" data-theme-toggle="" aria-label="Toggle color theme" hidden="">◐</button>
  <details class="mobile-nav">
    <summary aria-label="Menu">Menu</summary>
    <nav aria-label="Site (mobile)">
      <a href="/Projects/Numina/lore/">Lore</a>
      <a href="/Projects/Numina/mechanics/">Mechanics</a>
      <a href="/Projects/Numina/search/">Search</a>
    </nav>
  </details>
</header>

  <div class="shell shell--single">
  <main>
    <h1>Search</h1>
    <link rel="stylesheet" href="/Projects/Numina/pagefind/pagefind-ui.css">
    <div id="search"></div>
    <noscript><p>Search needs JavaScript. Try the <a href="/Projects/Numina/lore/">Lore</a> and <a href="/Projects/Numina/mechanics/">Mechanics</a> indexes instead.</p></noscript>
    <script src="/Projects/Numina/pagefind/pagefind-ui.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        var ui = new PagefindUI({
          element: "#search",
          bundlePath: "../pagefind/",
          showSubResults: true,
          showImages: false
        });
        var q = new URLSearchParams(location.search).get("q");
        if (q) ui.triggerSearch(q);
      });
    </script>
  </main>
</div>

  <footer class="site-footer">
  <p>
    Numina is created by Zyz Adventures, LLC.
    <a href="http://www.numinalarp.com" rel="external">Official site</a> ·
    <a href="https://discord.gg/YUbmyK4Ehb" rel="external">Discord</a>
  </p>
  <p class="site-footer__fine">Unofficial player reference. Content © Zyz Adventures, LLC.</p>
</footer>

  <script src="/Projects/Numina/js/theme.js" defer=""></script>
</body>
</html>
