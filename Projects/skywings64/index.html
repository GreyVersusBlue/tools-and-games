.sw-medal.bronze{background:radial-gradient(circle at 35% 30%,#ffd9b0,#d1823a 55%,#7a4310)}
.sw-medal.none{background:rgba(0,0,0,.35);border-style:dashed;opacity:.6}
#sw-confetti{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
/* countdown */
#sw-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sw-cnum{font:400 min(30vw,240px)/1 'Russo One';background:linear-gradient(180deg,#fff,#ffd45e 60%,#ff9a1c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 0 rgba(90,40,0,.5)) drop-shadow(0 0 40px rgba(255,180,40,.6));animation:swcount .9s cubic-bezier(.2,1,.3,1) forwards;position:relative}
.sw-cnum:after{content:'';position:absolute;left:50%;top:50%;width:1.3em;height:1.3em;margin:-.65em;border-radius:50%;border:5px solid rgba(255,255,255,.7);-webkit-text-fill-color:initial;animation:swring .9s ease-out forwards}
@keyframes swcount{0%{transform:scale(2.4);opacity:0}22%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.15}}
@keyframes swring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.8);opacity:0}}
@keyframes swblink{to{opacity:.35}}
@keyframes swin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
/* settings */
#sw-gear{position:fixed;right:18px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:#dff1ff;cursor:pointer;display:none;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 22px rgba(0,8,30,.5);transition:transform .3s,color .2s}
#sw-gear svg{width:24px;height:24px}#sw-gear:hover{transform:rotate(60deg);color:var(--amber)}
body:has(#ui .sw-screen) #sw-gear{display:flex}
body:has(#ui .sw-title) #sw-gear{bottom:calc(9vh + 12px)}
#sw-settings{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,6,20,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-family:'Inter',sans-serif}
#sw-settings.open{display:flex;animation:swscreen .25s ease-out}
#sw-settings .card{width:min(560px,92vw);max-height:90vh;overflow:auto;background:linear-gradient(160deg,rgba(30,54,104,.92),rgba(8,16,42,.95));border:1px solid var(--edge);border-radius:22px;padding:22px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#sw-settings .hd{display:flex;justify-content:space-between;align-items:center}
#sw-settings h2{font:400 26px 'Russo One';letter-spacing:.14em;margin:0}
#sw-settings h3{font:700 12px 'Rajdhani';letter-spacing:.4em;color:var(--cyan);margin:18px 0 6px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:6px}
#sw-settings .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;font-size:14px;color:#e5f0ff}
#sw-settings button{font:600 13px 'Rajdhani';letter-spacing:1.5px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 14px;cursor:pointer}
#sw-settings button:hover{background:rgba(255,255,255,.2)}
#sw-settings .x{font-size:24px;line-height:1;padding:2px 12px}
#sw-settings .seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#sw-settings .seg button{border:0;border-radius:0;background:transparent;padding:8px 14px}
#sw-settings .seg button.on{background:linear-gradient(#ffd86a,#ff8a1c);color:#2a1400}
#sw-settings .tog{width:52px;height:28px;padding:0;border-radius:14px;position:relative;background:rgba(255,255,255,.15)}
#sw-settings .tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
#sw-settings .tog.on{background:linear-gradient(#5be07a,#22a04a)}#sw-settings .tog.on i{transform:translateX(24px)}
#sw-settings input[type=range]{-webkit-appearance:none;appearance:none;width:240px;flex:none;margin-left:auto;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--amber) var(--p,50%),rgba(255,255,255,.18) var(--p,50%));outline-offset:6px}
#sw-settings output{width:34px;text-align:right;flex:none;font:700 14px Rajdhani;color:var(--amber)}
#sw-settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
#sw-settings input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;cursor:pointer}
#sw-settings .row label,#sw-settings label.row{cursor:default}
#sw-settings output{width:30px;text-align:right;font:400 13px 'Russo One';color:var(--amber)}
#sw-settings .ft{display:flex;justify-content:space-between;margin-top:20px}
#sw-settings .pri{background:linear-gradient(#5b9bff,#2050d0)}
#sw-settings :focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sw-card.locked{filter:grayscale(.85) brightness(.7)}
.sw-card.locked .ic>svg{opacity:.45}
.sw-card.locked:after{content:'\1F512';position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.sw-desc .lk{margin-top:6px;font:700 14px 'Rajdhani';letter-spacing:2px;color:var(--amber,#ffc53d)}
.sw-results .nb.unl{color:#7dffb0}
.replay-tag{position:fixed;top:18px;left:22px;font:700 15px 'Rajdhani';letter-spacing:3px;color:#ff5a5a;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:swblink 1.2s steps(2) infinite}
@keyframes swblink{50%{opacity:.25}}
.sw-desc.shake{animation:swshake .45s}
@keyframes swshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (max-width:900px){.sw-cards{grid-template-columns:repeat(2,minmax(140px,200px))}.keys{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div>SKYWINGS 64</div><div class="lbar"><div class="lfill"></div></div><div class="lmsg">LOADING...</div></div>
<div id="swerr"></div>
<script>
// Robust on-screen error overlay (classic script so it works even if module loading fails).
(function () {
  var box = document.getElementById('swerr'), seen = {}, n = 0;
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  window.__swShowError = function (e, where) {
    try {
      var msg = (e && (e.stack || e.message)) || String(e);
      var key = String(msg).slice(0, 200);
      if (seen[key] || n > 12) return;
      seen[key] = 1; n++;
      box.style.display = 'block';
      if (!box.firstChild) box.innerHTML = '<button onclick="this.parentNode.style.display=\'none\'">hide</button><b>SkyWings 64 error(s)</b>\n';
      box.insertAdjacentHTML('beforeend', '\n<b>' + esc(where || 'error') + '</b>: ' + esc(msg) + '\n');
    } catch (x) { /* ignore */ }
  };
  window.addEventListener('error', function (ev) {
    var e = ev.error || ev.message;
    window.__swShowError(e && e.stack ? e : (ev.message + ' @ ' + (ev.filename || '') + ':' + ev.lineno + ':' + ev.colno), 'window.onerror');
  });
  window.addEventListener('unhandledrejection', function (ev) { window.__swShowError(ev.reason, 'unhandledrejection'); });
  // Loading progress (main.js reports stages): frac 0..1, optional label. done=true fades the screen out.
  var shown = 0;
  window.__swLoad = function (frac, label, done) {
    var el = document.getElementById('loading'); if (!el) return;
    shown = Math.max(shown, Math.min(1, frac || 0));
    var f = el.querySelector('.lfill'), m = el.querySelector('.lmsg');
    if (f) f.style.width = (shown * 100).toFixed(1) + '%';
    if (m && label) m.textContent = label;
    el.setAttribute('aria-valuenow', String(Math.round(shown * 100)));
    if (done) { el.classList.add('done'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600); }
  };
  window.__swLoad(0.05, 'LOADING MODULES...');
})();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
